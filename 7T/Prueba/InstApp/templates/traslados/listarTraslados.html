<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Traslados de Recursos - L-MACK</title>
    <link rel="stylesheet" type="text/css" href="#{facesContext.externalContext.requestContextPath}/resources/css/emac-style.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        .layout-container {
            display: flex;
            min-height: 100vh;
            background-color: var(--cream-bg);
        }
        
        .sidebar {
            width: 260px;
            background-color: var(--primary-green);
            color: white;
            padding: 0;
            box-shadow: 2px 0 8px rgba(0,0,0,0.1);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            padding: 25px 20px;
            background-color: var(--dark-green);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .sidebar-header h3 {
            color: white;
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .sidebar-header h3::before {
            content: "👤";
            font-size: 28px;
        }
        
        .sidebar-nav {
            padding: 20px 0;
            flex: 1;
        }
        
        .sidebar-nav a {
            display: block;
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            padding: 15px 25px;
            transition: all 0.3s;
            border-left: 3px solid transparent;
            font-size: 15px;
        }
        
        .sidebar-nav a:hover {
            background: rgba(255,255,255,0.1);
            border-left-color: var(--light-green);
            color: white;
            padding-left: 30px;
        }
        
        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: auto;
        }
        
        .sidebar-footer .btn-logout {
            width: 100%;
            padding: 12px 20px;
            background-color: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .sidebar-footer .btn-logout:hover {
            background-color: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.3);
        }
        
        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 20px;
            min-height: 100vh;
            background-color: var(--cream-bg);
        }
        
        .content-wrapper {
            background: var(--white);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
    </style>
</h:head>

<h:body>
    <f:metadata>
        <f:viewAction action="#{loginBean.verificarSesion(2)}"/>
    </f:metadata>

    <div class="layout-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>L-MACK</h3>
            </div>
            <nav class="sidebar-nav">
                <h:link outcome="/pages/instructor/index.xhtml" value="🏠 Inicio" styleClass="sidebar-link"/>
                <h:link outcome="/pages/instructor/misFichas.xhtml" value="📁 Mis Fichas" styleClass="sidebar-link"/>
                <h:link outcome="/pages/instructor/asistencias/listarAsistencias.xhtml" value="📋 Asistencia" styleClass="sidebar-link"/>
                <h:link outcome="/pages/minutas/list.xhtml" value="📝 Minutas" styleClass="sidebar-link"/>
                <h:link outcome="/pages/instructor/listarIncidentes.xhtml" value="⚠️ Incidentes" styleClass="sidebar-link"/>
                <h:link outcome="/pages/instructor/traslados/listarTraslados.xhtml" value="🚚 Traslados" styleClass="sidebar-link"/>
                <h:link outcome="/pages/instructor/consultarAmbientes.xhtml" value="🏢 Ambientes" styleClass="sidebar-link"/>
                <h:link outcome="/pages/perfil.xhtml" value="👤 Mi Perfil" styleClass="sidebar-link"/>
            </nav>
            <div class="sidebar-footer">
                <h:form>
                    <p:commandButton value="Cerrar sesión"
                                     icon="pi pi-sign-out"
                                     action="#{loginBean.cerrarSesion}"
                                     styleClass="btn-logout"
                                     ajax="false"/>
                </h:form>
            </div>
        </aside>
        
        <main class="main-content">
            <div class="content-wrapper">
                <div class="form-header">
                    <h2><i class="pi pi-truck" style="margin-right: 10px;"></i>Traslados de Recursos</h2>
                </div>
                
                <p:messages showSummary="true" closable="true" severity="info,error,warn"/>

                <h:form id="formTraslados">
                    <div style="margin-bottom: 20px;">
                        <h:link value="➕ Nuevo Traslado"
                                outcome="/pages/instructor/traslados/formTraslado.xhtml"
                                styleClass="btn btn-primary"
                                style="text-decoration: none; display: inline-block; padding: 8px 16px;">
                            <i class="pi pi-plus" style="margin-right: 5px;"></i>
                        </h:link>
                    </div>

                    <p:toolbar style="margin-bottom: 10px;">
                        <f:facet name="left">
                            <p:commandButton value="📄 Exportar PDF"
                                             icon="pi pi-file-pdf"
                                             styleClass="btn-primary"
                                             ajax="false">
                                <p:dataExporter type="pdf" target="tablaTraslados" fileName="traslados"/>
                            </p:commandButton>
                            <p:commandButton value="📊 Exportar Excel"
                                             icon="pi pi-file-excel"
                                             styleClass="btn-success"
                                             ajax="false">
                                <p:dataExporter type="xls" target="tablaTraslados" fileName="traslados"/>
                            </p:commandButton>
                        </f:facet>
                    </p:toolbar>

                    <p:dataTable id="tablaTraslados" 
                                 value="#{trasladoRecursoBean.traslados}" 
                                 var="tras"
                                 filteredValue="#{trasladoRecursoBean.trasladosFiltrados}"
                                 emptyMessage="No hay traslados registrados"
                                 paginator="true" 
                                 rows="10"
                                 paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
                                 rowsPerPageTemplate="5,10,15,20"
                                 styleClass="table table-striped table-hover"
                                 exportable="true">

                        <p:column headerText="ID" 
                                 filterBy="#{tras.idTraslado}" 
                                 filterMatchMode="exact"
                                 style="width: 80px;">
                            <h:outputText value="#{tras.idTraslado}" />
                        </p:column>

                        <p:column headerText="Recurso" 
                                 filterBy="#{trasladoRecursoBean.getTextoRecurso(tras)}" 
                                 filterMatchMode="contains"
                                 exportValue="#{trasladoRecursoBean.getTextoRecurso(tras)}">
                            <h:outputText value="#{tras.recursoNombre != null ? tras.recursoNombre : 'Recurso ' + tras.recursoId}" />
                        </p:column>

                        <p:column headerText="Ambiente Origen" 
                                 filterBy="#{trasladoRecursoBean.getTextoAmbienteOrigen(tras)}" 
                                 filterMatchMode="contains"
                                 exportValue="#{trasladoRecursoBean.getTextoAmbienteOrigen(tras)}">
                            <h:outputText value="#{tras.ambienteOrigenNombre != null ? tras.ambienteOrigenNombre : 'Ambiente ' + tras.ambienteOrigen}" />
                        </p:column>

                        <p:column headerText="Ambiente Destino" 
                                 filterBy="#{trasladoRecursoBean.getTextoAmbienteDestino(tras)}" 
                                 filterMatchMode="contains"
                                 exportValue="#{trasladoRecursoBean.getTextoAmbienteDestino(tras)}">
                            <h:outputText value="#{tras.ambienteDestinoNombre != null ? tras.ambienteDestinoNombre : 'Ambiente ' + tras.ambienteDestino}" />
                        </p:column>

                        <p:column headerText="Fecha Traslado" 
                                 filterBy="#{trasladoRecursoBean.formatearFecha(tras.fechaTraslado)}" 
                                 filterMatchMode="contains"
                                 exportValue="#{trasladoRecursoBean.formatearFecha(tras.fechaTraslado)}">
                            <h:outputText value="#{trasladoRecursoBean.formatearFecha(tras.fechaTraslado)}" rendered="#{tras.fechaTraslado != null}" />
                        </p:column>

                        <p:column headerText="Observación" 
                                 filterBy="#{tras.observacion}" 
                                 filterMatchMode="contains">
                            <h:outputText value="#{tras.observacion != null ? tras.observacion : '—'}" />
                        </p:column>

                        <p:column headerText="Acciones" 
                                 style="width: 200px;"
                                 exportable="false">
                            <p:commandButton value="✏️ Editar" 
                                             action="#{trasladoRecursoBean.editar(tras.idTraslado)}"
                                             icon="pi pi-pencil"
                                             styleClass="btn btn-warning btn-sm"
                                             style="margin-right: 5px;"
                                             ajax="false"/>
                            <p:commandButton value="🗑️ Eliminar" 
                                             action="#{trasladoRecursoBean.eliminar(tras.idTraslado)}"
                                             icon="pi pi-trash"
                                             styleClass="btn btn-danger btn-sm"
                                             update="tablaTraslados"
                                             onclick="return confirm('¿Está seguro de eliminar el traslado ##{tras.idTraslado}?');"
                                             ajax="false"/>
                        </p:column>

                    </p:dataTable>
                </h:form>
            </div>
        </main>
    </div>

</h:body>
</html>
