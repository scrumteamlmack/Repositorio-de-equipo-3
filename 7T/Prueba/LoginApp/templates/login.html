{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}L-MACK - Iniciar Sesión{% endblock %}

{% block content %}
<!-- LOGIN FORM -->
<div class="login-container">
    <div class="login-card">

        <!-- HEADER -->
        <div class="login-header">
            <h2>Iniciar Sesión</h2>
        </div>

        <!-- FORM -->
        <form method="POST" action="{% url 'login:login' %}">
            {% csrf_token %}
            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <!-- MENSAJES -->
            {% if messages %}
                {% for message in messages %}
                    <div style="margin-bottom:10px; color:red;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <div class="login-form-group">
                <label>Número de documento</label>
                <input type="text" name="Cedula" placeholder="Número de documento" required
                    style="width: 100%; padding: 12px; border: 1px solid #e0e0e0; border-radius: 6px;">
            </div>

            <div class="login-form-group">
                <label>Contraseña</label>
                <input type="password" name="contraseña" placeholder="Contraseña" required
                    style="width: 100%; padding: 12px; border: 1px solid #e0e0e0; border-radius: 6px;">
            </div>

            <button type="submit" class="btn-primary"
                style="width: 100%; margin-top: 10px;">
                Entrar
            </button>
        </form>

    </div>
</div>

{% endblock %}
