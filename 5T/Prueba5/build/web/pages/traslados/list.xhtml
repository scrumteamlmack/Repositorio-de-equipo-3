<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Traslado de Recursos - L-MACK</title>
    <link rel="stylesheet" type="text/css" href="#{facesContext.externalContext.requestContextPath}/resources/css/emac-style.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        .traslado-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .form-section h3 {
            color: var(--primary-green);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--light-green);
        }
        .arrow-icon {
            font-size: 24px;
            color: var(--primary-green);
            text-align: center;
            padding: 10px;
        }
        .ambiente-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            border: 2px dashed #dee2e6;
        }
        .ambiente-card.origen {
            border-color: #ffc107;
            background: #fff9e6;
        }
        .ambiente-card.destino {
            border-color: var(--primary-green);
            background: #e8f5e9;
        }
    </style>
</h:head>

<h:body>
    <f:metadata>
        <f:event type="preRenderView" listener="#{loginBean.verificarSesion(2)}"/>
    </f:metadata>

    <h:form id="mainForm">
        <!-- NAVBAR SUPERIOR -->
        <div class="navbar">
            <div class="title">L-MACK</div>
            <div class="menu">
                <p:commandButton value="Inicio"
                                 icon="pi pi-home"
                                 action="/pages/instructor/index.xhtml?faces-redirect=true"
                                 styleClass="btn btn-secondary"
                                 ajax="false"/>
                <p:commandButton value="Cerrar sesión"
                                 icon="pi pi-sign-out"
                                 action="#{loginBean.cerrarSesion}"
                                 styleClass="btn btn-secondary"
                                 ajax="false"/>
            </div>
        </div>

        <div class="content traslado-container">
            <div class="form-header">
                <h2>📦 Traslado de Recursos</h2>
                <p style="color: #666;">Registra y consulta los traslados de recursos entre ambientes</p>
            </div>

            <p:messages id="msgs" showSummary="true" closable="true" severity="info,error,warn"/>

            <!-- FORMULARIO DE REGISTRO -->
            <div class="form-section">
                <h3>➕ Registrar Nuevo Traslado</h3>
                
                <div class="row">
                    <div class="col-md-4">
                        <div class="form-group" style="margin-bottom: 15px;">
                            <label class="form-label" style="font-weight: 600;">Recurso a trasladar:</label>
                            <p:selectOneMenu value="#{trasladoRecursoBean.traslado.recursoId}" 
                                             style="width: 100%;"
                                             styleClass="form-control">
                                <f:selectItem itemLabel="-- Seleccione un recurso --" itemValue="0"/>
                                <f:selectItems value="#{trasladoRecursoBean.recursos}" 
                                               var="r" 
                                               itemLabel="#{r.nombre} (Serial: #{r.serial})" 
                                               itemValue="#{r.idRecurso}"/>
                                <p:ajax event="change" listener="#{trasladoRecursoBean.onRecursoChange}" 
                                        update="ambienteOrigen"/>
                            </p:selectOneMenu>
                        </div>
                    </div>
                    
                    <div class="col-md-3">
                        <div class="ambiente-card origen">
                            <label style="font-weight: 600; color: #856404;">Ambiente Origen:</label>
                            <h:panelGroup id="ambienteOrigen">
                                <p:outputLabel value="#{trasladoRecursoBean.traslado.ambienteOrigenId > 0 ? trasladoRecursoBean.getNombreAmbiente(trasladoRecursoBean.traslado.ambienteOrigenId) : 'Seleccione un recurso'}"
                                               style="display: block; font-size: 16px; margin-top: 10px; color: #333;"/>
                            </h:panelGroup>
                        </div>
                    </div>
                    
                    <div class="col-md-1 arrow-icon d-flex align-items-center justify-content-center">
                        ➔
                    </div>
                    
                    <div class="col-md-4">
                        <div class="ambiente-card destino">
                            <label style="font-weight: 600; color: var(--dark-green);">Ambiente Destino:</label>
                            <p:selectOneMenu value="#{trasladoRecursoBean.traslado.ambienteDestinoId}" 
                                             style="width: 100%; margin-top: 10px;"
                                             styleClass="form-control">
                                <f:selectItem itemLabel="-- Seleccione destino --" itemValue="0"/>
                                <f:selectItems value="#{trasladoRecursoBean.ambientes}" 
                                               var="a" 
                                               itemLabel="Ambiente #{a.numero} - #{a.tipo}" 
                                               itemValue="#{a.idAmbiente}"/>
                            </p:selectOneMenu>
                        </div>
                    </div>
                </div>
                
                <div class="row" style="margin-top: 20px;">
                    <div class="col-md-12">
                        <div class="form-group">
                            <label class="form-label" style="font-weight: 600;">Observaciones:</label>
                            <p:inputTextarea value="#{trasladoRecursoBean.traslado.observacion}" 
                                             rows="3" 
                                             style="width: 100%;"
                                             styleClass="form-control"
                                             placeholder="Ingrese observaciones sobre el traslado (opcional)"/>
                        </div>
                    </div>
                </div>
                
                <div style="margin-top: 20px; text-align: right;">
                    <p:commandButton value="Registrar Traslado" 
                                     icon="pi pi-save"
                                     action="#{trasladoRecursoBean.guardar}"
                                     update="msgs tablaTraslados"
                                     styleClass="btn btn-primary"/>
                </div>
            </div>

            <!-- TABLA DE TRASLADOS -->
            <div class="form-section">
                <h3>📋 Historial de Traslados</h3>
                
                <p:dataTable id="tablaTraslados" 
                             value="#{trasladoRecursoBean.traslados}" 
                             var="t"
                             paginator="true" 
                             rows="10"
                             emptyMessage="No hay traslados registrados"
                             styleClass="table table-striped table-hover">
                    
                    <p:column headerText="ID" style="width: 60px;">
                        #{t.idTraslado}
                    </p:column>
                    
                    <p:column headerText="Recurso">
                        <span style="font-weight: 600;">#{t.nombreRecurso}</span>
                    </p:column>
                    
                    <p:column headerText="Origen">
                        <p:tag severity="warning" value="#{t.ambienteOrigen}"/>
                    </p:column>
                    
                    <p:column headerText="Destino">
                        <p:tag severity="success" value="#{t.ambienteDestino}"/>
                    </p:column>
                    
                    <p:column headerText="Fecha">
                        #{trasladoRecursoBean.formatearFecha(t.fechaTraslado)}
                    </p:column>
                    
                    <p:column headerText="Observación" style="max-width: 200px;">
                        <h:outputText value="#{t.observacion}" 
                                      rendered="#{not empty t.observacion}"
                                      style="font-size: 12px; color: #666;"/>
                        <h:outputText value="-" rendered="#{empty t.observacion}"/>
                    </p:column>
                    
                    <p:column headerText="Acciones" style="width: 100px;">
                        <p:commandButton icon="pi pi-trash"
                                         title="Eliminar"
                                         actionListener="#{trasladoRecursoBean.eliminar(t.idTraslado)}"
                                         update="tablaTraslados msgs"
                                         styleClass="btn btn-sm btn-danger"
                                         onclick="return confirm('¿Desea eliminar este registro de traslado?');"/>
                    </p:column>
                </p:dataTable>
            </div>
        </div>
    </h:form>
</h:body>
</html>
