<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Listar Fichas - L-MACK</title>
    <link rel="stylesheet" type="text/css" href="#{facesContext.externalContext.requestContextPath}/resources/css/emac-style.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</h:head>

<h:body>

    <h:form id="formListar">

        <!-- NAVBAR -->
        <div class="navbar">
            <div class="title">L-MACK</div>
            <div class="menu">
                <p:commandButton value="Inicio"
                                 icon="pi pi-home"
                                 action="/pages/admin/indexAdmin.xhtml?faces-redirect=true"
                                 styleClass="btn btn-secondary"
                                 ajax="false"/>
                <p:menuButton value="Administración" icon="pi pi-cog" styleClass="btn btn-secondary">
                    <p:menuitem value="Usuarios"
                                icon="pi pi-users"
                                outcome="/pages/admin/listarUsuarios.xhtml"/>
                    <p:menuitem value="Fichas"
                                icon="pi pi-file"
                                outcome="/pages/admin/listarFichas.xhtml"/>
                </p:menuButton>
                <p:commandButton value="Cerrar sesión"
                                 icon="pi pi-sign-out"
                                 action="#{loginBean.cerrarSesion}"
                                 styleClass="btn btn-secondary"
                                 ajax="false"/>
            </div>
        </div>

        <!-- CONTENIDO -->
        <div class="content">
            <div class="form-header">
                <h2><i class="pi pi-file" style="margin-right: 10px;"></i>Lista de Fichas</h2>
            </div>

            <p:messages showSummary="true" closable="true" severity="info,error,warn"/>

            <div style="margin-bottom: 20px;">
                <p:commandButton value="➕ Nueva Ficha"
                                 action="#{fichaBean.prepararNuevo}"
                                 icon="pi pi-plus"
                                 styleClass="btn btn-primary"
                                 ajax="false"/>
            </div>

            <div class="table-container">
                <p:dataTable value="#{fichaBean.fichasAgrupadas}" var="f" 
                             emptyMessage="No hay fichas registradas"
                             paginator="true" rows="10"
                             paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
                             rowsPerPageTemplate="5,10,15,20"
                             styleClass="table table-striped table-hover">

                    <p:column headerText="Número de Ficha" style="width: 150px;">
                        <h:outputText value="#{f.numFicha}" />
                    </p:column>

                    <p:column headerText="Instructores Asignados">
                        <h:panelGroup>
                            <h:outputText value="#{fichaBean.getNombreInstructor(fichaBean.getInstructoresDeFicha(f.numFicha).get(0))}" rendered="#{fichaBean.getInstructoresDeFicha(f.numFicha).size() > 0}"/>
                            <h:outputText value=", " rendered="#{fichaBean.getInstructoresDeFicha(f.numFicha).size() > 1}"/>
                            <h:outputText value="#{fichaBean.getNombreInstructor(fichaBean.getInstructoresDeFicha(f.numFicha).get(1))}" rendered="#{fichaBean.getInstructoresDeFicha(f.numFicha).size() > 1}"/>
                            <h:outputText value=" y #{fichaBean.getInstructoresDeFicha(f.numFicha).size() - 2} más" rendered="#{fichaBean.getInstructoresDeFicha(f.numFicha).size() > 2}"/>
                        </h:panelGroup>
                    </p:column>

                    <p:column headerText="Cantidad Instructores" style="width: 150px;">
                        <h:outputText value="#{fichaBean.getInstructoresDeFicha(f.numFicha).size()}" />
                    </p:column>

                    <p:column headerText="Acciones" style="width: 150px;">
                        <div style="display: flex; gap: 5px;">
                            <p:commandButton icon="pi pi-pencil"
                                             title="Editar"
                                             action="#{fichaBean.editar(f.idFicha)}"
                                             ajax="false"
                                             styleClass="btn btn-sm btn-secondary"/>
                            <p:commandButton icon="pi pi-trash"
                                             title="Eliminar"
                                             actionListener="#{fichaBean.eliminar(f.idFicha)}"
                                             update="@form"
                                             styleClass="btn btn-sm btn-danger"
                                             onclick="return confirm('¿Está seguro de eliminar esta ficha?');"/>
                        </div>
                    </p:column>

                </p:dataTable>
            </div>

        </div>

    </h:form>

</h:body>
</html>
