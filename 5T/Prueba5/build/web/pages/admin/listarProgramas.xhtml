<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Listar Programas - L-MACK</title>
    <link rel="stylesheet" type="text/css" href="#{facesContext.externalContext.requestContextPath}/resources/css/emac-style.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</h:head>

<h:body>

    <h:form id="formListar">

        <!-- NAVBAR -->
        <div class="navbar">
            <div class="title">L-MACK</div>
            <div class="menu">
                <p:commandButton value="Inicio"
                                 icon="pi pi-home"
                                 action="/pages/admin/indexAdmin.xhtml?faces-redirect=true"
                                 styleClass="btn btn-secondary"
                                 ajax="false"/>
                <p:menuButton value="Administración" icon="pi pi-cog" styleClass="btn btn-secondary">
                    <p:menuitem value="Usuarios"
                                icon="pi pi-users"
                                outcome="/pages/admin/listarUsuarios.xhtml"/>
                    <p:menuitem value="Fichas"
                                icon="pi pi-file"
                                outcome="/pages/admin/listarFichas.xhtml"/>
                    <p:menuitem value="Programas"
                                icon="pi pi-book"
                                outcome="/pages/admin/listarProgramas.xhtml"/>
                </p:menuButton>
                <p:commandButton value="Cerrar sesión"
                                 icon="pi pi-sign-out"
                                 action="#{loginBean.cerrarSesion}"
                                 styleClass="btn btn-secondary"
                                 ajax="false"/>
            </div>
        </div>

        <!-- CONTENIDO -->
        <div class="content">
            <div class="form-header">
                <h2><i class="pi pi-book" style="margin-right: 10px;"></i>Lista de Programas</h2>
            </div>

            <p:messages showSummary="true" closable="true" severity="info,error,warn"/>

            <div style="margin-bottom: 20px;">
                <h:link value="➕ Nuevo Programa"
                        outcome="/pages/admin/formPrograma.xhtml"
                        styleClass="btn btn-primary"
                        style="text-decoration: none; display: inline-block; padding: 8px 16px;">
                    <i class="pi pi-plus" style="margin-right: 5px;"></i>
                </h:link>
            </div>

            <div class="table-container">
                <p:dataTable value="#{programaBean.programas}" var="prog" 
                             emptyMessage="No hay programas registrados"
                             paginator="true" rows="10"
                             paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
                             rowsPerPageTemplate="5,10,15,20"
                             styleClass="table table-striped table-hover">

                    <p:column headerText="ID" style="width: 60px;">
                        <h:outputText value="#{prog.idProgramas}" />
                    </p:column>

                    <p:column headerText="Nombre del Programa">
                        <h:outputText value="#{prog.nombrePrograma}" />
                    </p:column>

                    <p:column headerText="Nivel de Formación">
                        <h:outputText value="#{prog.nivelFormacion}" />
                    </p:column>

                    <p:column headerText="Duración">
                        <h:outputText value="#{prog.duracion}" />
                    </p:column>

                    <p:column headerText="Jornada">
                        <h:outputText value="#{programaBean.getNombreJornada(prog.jornadaId)}" />
                    </p:column>

                    <p:column headerText="Modalidad">
                        <h:outputText value="#{programaBean.getNombreModalidad(prog.modalidadId)}" />
                    </p:column>

                    <p:column headerText="Coordinación">
                        <h:outputText value="#{programaBean.getNombreCoordinacion(prog.coordinacionId)}" />
                    </p:column>

                    <p:column headerText="Acciones" style="width: 150px;">
                        <div style="display: flex; gap: 5px;">
                            <p:commandButton icon="pi pi-pencil"
                                             title="Editar"
                                             action="#{programaBean.editar(prog.idProgramas)}"
                                             ajax="false"
                                             styleClass="btn btn-sm btn-secondary"/>
                            <p:commandButton icon="pi pi-trash"
                                             title="Eliminar"
                                             actionListener="#{programaBean.eliminar(prog.idProgramas)}"
                                             update="@form"
                                             styleClass="btn btn-sm btn-danger"
                                             onclick="return confirm('¿Está seguro de eliminar este programa?');"/>
                        </div>
                    </p:column>

                </p:dataTable>
            </div>

        </div>

    </h:form>

</h:body>
</html>
