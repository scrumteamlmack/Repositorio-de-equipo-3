<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Panel Administrador - L-MACK</title>
    <link rel="stylesheet" type="text/css" href="#{facesContext.externalContext.requestContextPath}/resources/css/emac-style.css"/>
</h:head>

<h:body>

    <h:form>

        <!-- NAVBAR SUPERIOR -->
        <div class="navbar">
            <div class="title">L-MACK</div>
            <div class="menu">
                <p:commandButton value="Inicio"
                                 icon="pi pi-home"
                                 action="/pages/admin/indexAdmin.xhtml?faces-redirect=true"
                                 styleClass="btn-secondary"
                                 ajax="false"/>
                <p:menuButton value="Usuarios" icon="pi pi-users">
                    <p:menuitem value="Crear Usuario"
                                icon="pi pi-plus"
                                outcome="/pages/admin/formUsuario.xhtml"/>
                    <p:menuitem value="Listar Usuarios"
                                icon="pi pi-list"
                                outcome="/pages/admin/listarUsuarios.xhtml"/>
                </p:menuButton>
                <p:commandButton value="Cerrar sesión"
                                 icon="pi pi-sign-out"
                                 action="#{loginBean.cerrarSesion}"
                                 styleClass="btn-secondary"
                                 ajax="false"/>
            </div>
        </div>

        <!-- CONTENIDO PRINCIPAL -->
        <div class="content">
            <div class="form-header">
                <h2>Bienvenido Administrador</h2>
            </div>
            
            <div class="card" style="margin-top: 20px;">
                <h3 style="color: #667eea; margin-bottom: 15px;">Hola, #{usuarioBean.usuario.PNombre} #{usuarioBean.usuario.PApellido}</h3>
                <p style="color: #6c757d; line-height: 1.6;">Seleccione una opción del menú superior para comenzar a gestionar el sistema.</p>
            </div>
        </div>

    </h:form>

</h:body>
</html>
