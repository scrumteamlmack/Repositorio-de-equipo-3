<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Listar Incidentes - L-MACK</title>
    <link rel="stylesheet" type="text/css" href="#{facesContext.externalContext.requestContextPath}/resources/css/emac-style.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</h:head>

<h:body>

    <h:form id="formListar">

        <!-- NAVBAR -->
        <div class="navbar">
            <div class="title">L-MACK</div>
            <div class="menu">
                <p:commandButton value="Inicio"
                                 icon="pi pi-home"
                                 action="/pages/instructor/index.xhtml?faces-redirect=true"
                                 styleClass="btn btn-secondary"
                                 ajax="false"/>
                <p:menuButton value="Módulos" icon="pi pi-th-large" styleClass="btn btn-secondary">
                    <p:menuitem value="Mis Fichas"
                                icon="pi pi-file"
                                outcome="/pages/instructor/misFichas.xhtml"/>
                    <p:menuitem value="Asistencia"
                                icon="pi pi-check-circle"
                                outcome="/pages/asistencia/list.xhtml"/>
                    <p:menuitem value="Minutas"
                                icon="pi pi-file"
                                outcome="/pages/minutas/list.xhtml"/>
                    <p:menuitem value="Incidentes"
                                icon="pi pi-exclamation-triangle"
                                outcome="/pages/instructor/listarIncidentes.xhtml"/>
                </p:menuButton>
                <p:commandButton value="Mi Perfil"
                                 icon="pi pi-user"
                                 action="/pages/perfil.xhtml?faces-redirect=true"
                                 styleClass="btn btn-secondary"
                                 ajax="false"/>
                <p:commandButton value="Cerrar sesión"
                                 icon="pi pi-sign-out"
                                 action="#{loginBean.cerrarSesion}"
                                 styleClass="btn btn-secondary"
                                 ajax="false"/>
            </div>
        </div>

        <!-- CONTENIDO -->
        <div class="content">
            <div class="form-header">
                <h2><i class="pi pi-exclamation-triangle" style="margin-right: 10px;"></i>Lista de Incidentes</h2>
            </div>

            <p:messages showSummary="true" closable="true" severity="info,error,warn"/>

            <div style="margin-bottom: 20px;">
                <h:link value="➕ Nuevo Incidente"
                        outcome="/pages/instructor/formIncidente.xhtml"
                        styleClass="btn btn-primary"
                        style="text-decoration: none; display: inline-block; padding: 8px 16px;">
                    <i class="pi pi-plus" style="margin-right: 5px;"></i>
                </h:link>
            </div>

            <div class="table-container">
                <p:dataTable value="#{incidenteBean.incidentes}" var="inc" 
                             emptyMessage="No hay incidentes registrados"
                             paginator="true" rows="10"
                             paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
                             rowsPerPageTemplate="5,10,15,20"
                             styleClass="table table-striped table-hover">

                    <p:column headerText="ID" style="width: 60px;">
                        <h:outputText value="#{inc.idIncidente}" />
                    </p:column>

                    <p:column headerText="Descripción" style="width: 300px;">
                        <h:outputText value="#{inc.descripcion}" />
                    </p:column>

                    <p:column headerText="Fecha" style="width: 120px;">
                        <h:outputText value="#{incidenteBean.formatearFecha(inc.fecha)}" />
                    </p:column>

                    <p:column headerText="Hora" style="width: 100px;">
                        <h:outputText value="#{incidenteBean.formatearHora(inc.hora)}" />
                    </p:column>

                    <p:column headerText="Ambiente">
                        <h:outputText value="#{incidenteBean.getNombreAmbiente(inc.idAmbiente)}" rendered="#{inc.idAmbiente > 0}" />
                        <h:outputText value="-" rendered="#{inc.idAmbiente == 0}" style="color: #999;"/>
                    </p:column>

                    <p:column headerText="Tipo de Incidente">
                        <h:outputText value="#{incidenteBean.getNombreTipoIncidente(inc.idTipoIncidente)}" rendered="#{inc.idTipoIncidente > 0}" />
                        <h:outputText value="-" rendered="#{inc.idTipoIncidente == 0}" style="color: #999;"/>
                    </p:column>

                    <p:column headerText="Reportado por">
                        <h:outputText value="#{incidenteBean.getNombreInstructor(inc.idReportador)}" rendered="#{inc.idReportador > 0}" />
                        <h:outputText value="-" rendered="#{inc.idReportador == 0}" style="color: #999;"/>
                    </p:column>

                    <p:column headerText="Acciones" style="width: 150px;">
                        <div style="display: flex; gap: 5px;">
                            <p:commandButton icon="pi pi-pencil"
                                             title="Editar"
                                             action="#{incidenteBean.editar(inc.idIncidente)}"
                                             ajax="false"
                                             styleClass="btn btn-sm btn-secondary"/>
                            <p:commandButton icon="pi pi-trash"
                                             title="Eliminar"
                                             actionListener="#{incidenteBean.eliminar(inc.idIncidente)}"
                                             update="@form"
                                             styleClass="btn btn-sm btn-danger"
                                             onclick="return confirm('¿Está seguro de eliminar este incidente?');"/>
                        </div>
                    </p:column>

                </p:dataTable>
            </div>

        </div>

    </h:form>

</h:body>
</html>
