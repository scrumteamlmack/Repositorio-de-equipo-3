<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Listar Incidentes - L-MACK</title>
    <link rel="stylesheet" type="text/css" href="#{facesContext.externalContext.requestContextPath}/resources/css/emac-style.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        /* Estilos para paginador */
        .ui-paginator {
            background: transparent !important;
            border: none !important;
            padding: 15px 0 !important;
        }
        .ui-paginator .ui-paginator-page,
        .ui-paginator .ui-paginator-first,
        .ui-paginator .ui-paginator-prev,
        .ui-paginator .ui-paginator-next,
        .ui-paginator .ui-paginator-last {
            background: #f8f9fa !important;
            border: 1px solid #dee2e6 !important;
            color: #495057 !important;
            min-width: 2.5rem !important;
            height: 2.5rem !important;
            border-radius: 6px !important;
            margin: 0 2px !important;
        }
        .ui-paginator .ui-paginator-page.ui-state-active {
            background: var(--primary-green) !important;
            border-color: var(--primary-green) !important;
            color: white !important;
        }
        .ui-paginator .ui-paginator-page:hover,
        .ui-paginator .ui-paginator-first:hover,
        .ui-paginator .ui-paginator-prev:hover,
        .ui-paginator .ui-paginator-next:hover,
        .ui-paginator .ui-paginator-last:hover {
            background: #e9ecef !important;
        }
        .ui-paginator-rpp-options {
            border: 1px solid #dee2e6 !important;
            border-radius: 6px !important;
            padding: 5px 10px !important;
        }
    </style>
</h:head>

<h:body>
    <f:metadata>
        <f:viewAction action="#{loginBean.verificarSesionInstructor()}"/>
    </f:metadata>

    <div class="dashboard-container" style="display: flex; min-height: 100vh;">
        <!-- SIDEBAR -->
        <aside class="sidebar" style="width: 260px; background: linear-gradient(180deg, var(--primary-green) 0%, var(--dark-green) 100%); color: white; position: fixed; height: 100vh; overflow-y: auto;">
            <div class="sidebar-header" style="padding: 25px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: center;">
                <h2 style="margin: 0; font-size: 24px; color: white;">🎓 L-MACK</h2>
                <p style="margin: 5px 0 0; font-size: 12px; opacity: 0.8;">Panel Instructor</p>
            </div>
            <nav style="padding: 15px 0;">
                <p style="padding: 10px 20px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.5); margin-top: 10px;">Principal</p>
                <h:link outcome="/pages/instructor/index.xhtml" style="display: block; color: rgba(255,255,255,0.85); text-decoration: none; padding: 12px 25px; border-left: 3px solid transparent; font-size: 14px;">🏠 Inicio</h:link>
                
                <p style="padding: 10px 20px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.5); margin-top: 10px;">Gestión Académica</p>
                <h:link outcome="/pages/instructor/misFichas.xhtml" style="display: block; color: rgba(255,255,255,0.85); text-decoration: none; padding: 12px 25px; border-left: 3px solid transparent; font-size: 14px;">📁 Mis Fichas</h:link>
                <h:link outcome="/pages/asistencia/list.xhtml" style="display: block; color: rgba(255,255,255,0.85); text-decoration: none; padding: 12px 25px; border-left: 3px solid transparent; font-size: 14px;">📋 Asistencia</h:link>
                
                <p style="padding: 10px 20px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.5); margin-top: 10px;">Ambientes y Recursos</p>
                <h:link outcome="/pages/instructor/ambientes.xhtml" style="display: block; color: rgba(255,255,255,0.85); text-decoration: none; padding: 12px 25px; border-left: 3px solid transparent; font-size: 14px;">🏢 Ambientes</h:link>
                <h:link outcome="/pages/minutas/list.xhtml" style="display: block; color: rgba(255,255,255,0.85); text-decoration: none; padding: 12px 25px; border-left: 3px solid transparent; font-size: 14px;">📝 Minutas</h:link>
                <h:link outcome="/pages/traslados/list.xhtml" style="display: block; color: rgba(255,255,255,0.85); text-decoration: none; padding: 12px 25px; border-left: 3px solid transparent; font-size: 14px;">📦 Traslados</h:link>
                
                <p style="padding: 10px 20px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.5); margin-top: 10px;">Incidentes</p>
                <h:link outcome="/pages/instructor/formIncidente.xhtml" style="display: block; color: rgba(255,255,255,0.85); text-decoration: none; padding: 12px 25px; border-left: 3px solid transparent; font-size: 14px;">⚠️ Registrar</h:link>
                <h:link outcome="/pages/instructor/listarIncidentes.xhtml" style="display: block; color: white; text-decoration: none; padding: 12px 25px; border-left: 3px solid white; font-size: 14px; background: rgba(255,255,255,0.15);">📋 Mis Incidentes</h:link>
            </nav>
            <div style="position: absolute; bottom: 20px; left: 0; right: 0; padding: 0 20px;">
                <h:form>
                    <p:commandButton value="🚪 Cerrar Sesión" 
                                     action="#{loginBean.cerrarSesion}"
                                     style="width: 100%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 12px; border-radius: 8px; cursor: pointer;"
                                     ajax="false"/>
                </h:form>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main style="flex: 1; margin-left: 260px; padding: 20px; background: var(--cream-bg);">
            <h:form id="formListar">
                <div class="content" style="max-width: 1400px; margin: 0 auto;">
            <div class="form-header">
                <h2><i class="pi pi-exclamation-triangle" style="margin-right: 10px;"></i>Lista de Incidentes</h2>
            </div>

            <p:messages showSummary="true" closable="true" severity="info,error,warn"/>

            <div style="margin-bottom: 20px;">
                <h:link value="➕ Nuevo Incidente"
                        outcome="/pages/instructor/formIncidente.xhtml"
                        styleClass="btn btn-primary"
                        style="text-decoration: none; display: inline-block; padding: 8px 16px;">
                    <i class="pi pi-plus" style="margin-right: 5px;"></i>
                </h:link>
            </div>

            <div class="table-container">
                <p:dataTable value="#{incidenteBean.incidentes}" var="inc" 
                             emptyMessage="No hay incidentes registrados"
                             paginator="true" rows="10"
                             paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}"
                             rowsPerPageTemplate="5,10,15,20"
                             styleClass="table table-striped table-hover"
                             widgetVar="tablaIncidentesWidget">

                    <p:column headerText="ID" style="width: 60px;" filterBy="#{inc.idIncidente}" filterMatchMode="contains">
                        <h:outputText value="#{inc.idIncidente}" />
                    </p:column>

                    <p:column headerText="Descripción" filterBy="#{inc.descripcion}" filterMatchMode="contains">
                        <h:outputText value="#{inc.descripcion}" />
                    </p:column>

                    <p:column headerText="Fecha" style="width: 120px;" filterBy="#{incidenteBean.formatearFecha(inc.fecha)}" filterMatchMode="contains">
                        <h:outputText value="#{incidenteBean.formatearFecha(inc.fecha)}" />
                    </p:column>

                    <p:column headerText="Hora" style="width: 100px;" filterBy="#{incidenteBean.formatearHora(inc.hora)}" filterMatchMode="contains">
                        <h:outputText value="#{incidenteBean.formatearHora(inc.hora)}" />
                    </p:column>

                    <p:column headerText="Ambiente" filterBy="#{incidenteBean.getNombreAmbiente(inc.idAmbiente)}" filterMatchMode="contains">
                        <h:outputText value="#{incidenteBean.getNombreAmbiente(inc.idAmbiente)}" rendered="#{inc.idAmbiente > 0}" />
                        <h:outputText value="-" rendered="#{inc.idAmbiente == 0}" style="color: #999;"/>
                    </p:column>

                    <p:column headerText="Tipo de Incidente" filterBy="#{incidenteBean.getNombreTipoIncidente(inc.idTipoIncidente)}" filterMatchMode="contains">
                        <h:outputText value="#{incidenteBean.getNombreTipoIncidente(inc.idTipoIncidente)}" rendered="#{inc.idTipoIncidente > 0}" />
                        <h:outputText value="-" rendered="#{inc.idTipoIncidente == 0}" style="color: #999;"/>
                    </p:column>

                    <p:column headerText="Reportado por" filterBy="#{incidenteBean.getNombreInstructor(inc.idReportador)}" filterMatchMode="contains">
                        <h:outputText value="#{incidenteBean.getNombreInstructor(inc.idReportador)}" rendered="#{inc.idReportador > 0}" />
                        <h:outputText value="-" rendered="#{inc.idReportador == 0}" style="color: #999;"/>
                    </p:column>

                    <p:column headerText="Acciones" style="width: 200px; text-align: center;">
                        <div style="display: flex; gap: 6px; justify-content: center; align-items: center;">
                            <p:commandButton value="Editar"
                                             style="background: #ffc107; color: #333; border: none; padding: 6px 12px; border-radius: 5px; font-weight: 500; font-size: 13px;"
                                             action="#{incidenteBean.editar(inc.idIncidente)}"
                                             ajax="false"/>
                            <p:commandButton value="Eliminar"
                                             style="background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 5px; font-weight: 500; font-size: 13px;"
                                             actionListener="#{incidenteBean.eliminar(inc.idIncidente)}"
                                             update="@form"
                                             onclick="return confirm('¿Está seguro de eliminar este incidente?');"/>
                        </div>
                    </p:column>

                </p:dataTable>
            </div>

                </div>
            </h:form>
        </main>
    </div>
</h:body>
</html>
