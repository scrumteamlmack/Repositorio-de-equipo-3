<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Registrar Incidente - L-MACK</title>
    <link rel="stylesheet" type="text/css" href="#{facesContext.externalContext.requestContextPath}/resources/css/emac-style.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</h:head>

<h:body>
    <f:metadata>
        <f:viewAction action="#{loginBean.verificarSesionInstructor()}"/>
        <f:viewParam name="idIncidenteEditar" value="#{incidenteBean.idIncidenteEditar}">
            <f:converter converterId="javax.faces.Integer" />
        </f:viewParam>
    </f:metadata>

    <div class="dashboard-container" style="display: flex; min-height: 100vh;">
        <!-- SIDEBAR -->
        <aside class="sidebar" style="width: 260px; background: linear-gradient(180deg, var(--primary-green) 0%, var(--dark-green) 100%); color: white; position: fixed; height: 100vh; overflow-y: auto;">
            <div class="sidebar-header" style="padding: 25px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: center;">
                <h2 style="margin: 0; font-size: 24px; color: white;">🎓 L-MACK</h2>
                <p style="margin: 5px 0 0; font-size: 12px; opacity: 0.8;">Panel Instructor</p>
            </div>
            <nav style="padding: 15px 0;">
                <p style="padding: 10px 20px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.5); margin-top: 10px;">Principal</p>
                <h:link outcome="/pages/instructor/index.xhtml" style="display: block; color: rgba(255,255,255,0.85); text-decoration: none; padding: 12px 25px; border-left: 3px solid transparent; font-size: 14px;">🏠 Inicio</h:link>
                
                <p style="padding: 10px 20px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.5); margin-top: 10px;">Gestión Académica</p>
                <h:link outcome="/pages/instructor/misFichas.xhtml" style="display: block; color: rgba(255,255,255,0.85); text-decoration: none; padding: 12px 25px; border-left: 3px solid transparent; font-size: 14px;">📁 Mis Fichas</h:link>
                <h:link outcome="/pages/asistencia/list.xhtml" style="display: block; color: rgba(255,255,255,0.85); text-decoration: none; padding: 12px 25px; border-left: 3px solid transparent; font-size: 14px;">📋 Asistencia</h:link>
                
                <p style="padding: 10px 20px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.5); margin-top: 10px;">Ambientes y Recursos</p>
                <h:link outcome="/pages/instructor/ambientes.xhtml" style="display: block; color: rgba(255,255,255,0.85); text-decoration: none; padding: 12px 25px; border-left: 3px solid transparent; font-size: 14px;">🏢 Ambientes</h:link>
                <h:link outcome="/pages/minutas/list.xhtml" style="display: block; color: rgba(255,255,255,0.85); text-decoration: none; padding: 12px 25px; border-left: 3px solid transparent; font-size: 14px;">📝 Minutas</h:link>
                <h:link outcome="/pages/traslados/list.xhtml" style="display: block; color: rgba(255,255,255,0.85); text-decoration: none; padding: 12px 25px; border-left: 3px solid transparent; font-size: 14px;">📦 Traslados</h:link>
                
                <p style="padding: 10px 20px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.5); margin-top: 10px;">Incidentes</p>
                <h:link outcome="/pages/instructor/formIncidente.xhtml" style="display: block; color: white; text-decoration: none; padding: 12px 25px; border-left: 3px solid white; font-size: 14px; background: rgba(255,255,255,0.15);">⚠️ Registrar</h:link>
                <h:link outcome="/pages/instructor/listarIncidentes.xhtml" style="display: block; color: rgba(255,255,255,0.85); text-decoration: none; padding: 12px 25px; border-left: 3px solid transparent; font-size: 14px;">📋 Mis Incidentes</h:link>
            </nav>
            <div style="position: absolute; bottom: 20px; left: 0; right: 0; padding: 0 20px;">
                <h:form>
                    <p:commandButton value="🚪 Cerrar Sesión" 
                                     action="#{loginBean.cerrarSesion}"
                                     style="width: 100%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 12px; border-radius: 8px; cursor: pointer;"
                                     ajax="false"/>
                </h:form>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main style="flex: 1; margin-left: 260px; padding: 20px; background: var(--cream-bg);">
            <h:form id="formIncidente">
                <div class="content" style="max-width: 1400px; margin: 0 auto;">

            <div class="form-header">
                <h2>
                    <i class="pi pi-exclamation-triangle" style="margin-right: 10px;"></i>
                    #{incidenteBean.modoEdicion ? 'Editar Incidente' : 'Registrar Incidente'}
                </h2>
            </div>

            <p:messages showSummary="true" closable="true" severity="info,error,warn"/>

            <p:panel header="Datos del Incidente">
                <h:panelGrid columns="2" cellpadding="15" columnClasses="label-col, input-col">

                    <h:outputLabel value="Descripción:" for="descripcion" />
                    <p:inputTextarea id="descripcion" 
                                     value="#{incidenteBean.incidente.descripcion}" 
                                     required="true"
                                     requiredMessage="Debe ingresar una descripción"
                                     rows="4"
                                     cols="50"
                                     autoResize="false"
                                     style="width: 100%;"/>

                    <h:outputLabel value="Fecha del Incidente:" for="fecha" />
                    <p:calendar id="fecha"
                                value="#{incidenteBean.fechaDate}"
                                required="true"
                                requiredMessage="Debe seleccionar una fecha"
                                pattern="dd/MM/yyyy"
                                showIcon="true"
                                locale="es"
                                style="width: 100%;"/>

                    <h:outputLabel value="Hora del Incidente:" for="hora" />
                    <h:panelGroup>
                        <p:inputText id="hora"
                                      value="#{incidenteBean.horaString}"
                                      required="true"
                                      requiredMessage="Debe ingresar una hora"
                                      placeholder="HH:mm (ejemplo: 14:30)"
                                      style="width: 100%;">
                            <f:validateRegex pattern="^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$" />
                        </p:inputText>
                        <h:outputText value="Formato: HH:mm (ejemplo: 14:30)" style="font-size: 0.85em; color: #666; display: block; margin-top: 5px;"/>
                    </h:panelGroup>

                    <h:outputLabel value="Ambiente:" for="ambiente" />
                    <p:selectOneMenu id="ambiente" 
                                     value="#{incidenteBean.incidente.idAmbiente}" 
                                     required="true" 
                                     requiredMessage="Debe seleccionar un ambiente"
                                     filter="true"
                                     style="width: 100%;">
                        <f:selectItem itemLabel="Seleccione un ambiente" itemValue="0" />
                        <f:selectItems value="#{incidenteBean.ambientes}" 
                                      var="amb"
                                      itemLabel="Ambiente #{amb.numero} - #{amb.tipo}" 
                                      itemValue="#{amb.idAmbiente}" />
                    </p:selectOneMenu>

                    <h:outputLabel value="Tipo de Incidente:" for="tipoIncidente" />
                    <p:selectOneMenu id="tipoIncidente" 
                                     value="#{incidenteBean.incidente.idTipoIncidente}" 
                                     required="true" 
                                     requiredMessage="Debe seleccionar un tipo de incidente"
                                     filter="true"
                                     style="width: 100%;">
                        <f:selectItem itemLabel="Seleccione un tipo de incidente" itemValue="0" />
                        <f:selectItems value="#{incidenteBean.tiposIncidente}" 
                                      var="tipo"
                                      itemLabel="#{tipo.nombre}" 
                                      itemValue="#{tipo.idTipoIncidente}" />
                    </p:selectOneMenu>

                    <h:outputLabel value="Instructor Reportador:" for="reportador" />
                    <h:panelGroup>
                        <h:outputText value="#{incidenteBean.nombreReportador}" 
                                     style="font-weight: bold; color: var(--primary-green);"/>
                        <h:outputText value=" (Asignado automáticamente)" 
                                     style="font-size: 0.85em; color: #666; margin-left: 5px;"/>
                    </h:panelGroup>

                </h:panelGrid>

                <div class="form-actions">
                    <p:commandButton value="Guardar"
                                     action="#{incidenteBean.guardar}"
                                     icon="pi pi-save"
                                     ajax="false"
                                     styleClass="btn-primary"/>
                    <p:commandButton value="Cancelar"
                                     action="/pages/instructor/listarIncidentes.xhtml?faces-redirect=true"
                                     icon="pi pi-times"
                                     ajax="false"
                                     styleClass="btn-secondary"/>
                </div>

            </p:panel>
                </div>
            </h:form>
        </main>
    </div>
</h:body>
</html>
