<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Registrar Programa - L-MACK</title>
    <link rel="stylesheet" type="text/css" href="#{facesContext.externalContext.requestContextPath}/resources/css/emac-style.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</h:head>

<h:body>
    <f:metadata>
        <f:viewParam name="idProgramaEditar" value="#{programaBean.idProgramaEditar}">
            <f:converter converterId="javax.faces.Integer" />
        </f:viewParam>
    </f:metadata>

    <h:form id="formPrograma">

        <!-- NAVBAR -->
        <div class="navbar">
            <div class="title">L-MACK</div>
            <div class="menu">
                <p:commandButton value="Inicio"
                                 icon="pi pi-home"
                                 action="/pages/admin/indexAdmin.xhtml?faces-redirect=true"
                                 styleClass="btn btn-secondary"
                                 ajax="false"/>
                <p:menuButton value="Administración" icon="pi pi-cog" styleClass="btn btn-secondary">
                    <p:menuitem value="Usuarios"
                                icon="pi pi-users"
                                outcome="/pages/admin/listarUsuarios.xhtml"/>
                    <p:menuitem value="Fichas"
                                icon="pi pi-file"
                                outcome="/pages/admin/listarFichas.xhtml"/>
                    <p:menuitem value="Programas"
                                icon="pi pi-book"
                                outcome="/pages/admin/listarProgramas.xhtml"/>
                </p:menuButton>
                <p:commandButton value="Cerrar sesión"
                                 icon="pi pi-sign-out"
                                 action="#{loginBean.cerrarSesion}"
                                 styleClass="btn btn-secondary"
                                 ajax="false"/>
            </div>
        </div>

        <!-- CONTENIDO -->
        <div class="content">
            <div class="form-header">
                <h2>
                    <i class="pi pi-book" style="margin-right: 10px;"></i>
                    #{programaBean.modoEdicion ? 'Editar Programa' : 'Registrar Programa'}
                </h2>
            </div>

            <p:messages showSummary="true" closable="true" severity="info,error,warn"/>

            <p:panel header="Datos del Programa">
                <h:panelGrid columns="2" cellpadding="15" columnClasses="label-col, input-col">

                    <h:outputLabel value="Nombre del Programa:" for="nombrePrograma" />
                    <p:inputText id="nombrePrograma" 
                                 value="#{programaBean.programa.nombrePrograma}" 
                                 required="true"
                                 requiredMessage="Debe ingresar un nombre para el programa"
                                 style="width: 100%;"/>

                    <h:outputLabel value="Nivel de Formación:" for="nivelFormacion" />
                    <p:inputText id="nivelFormacion"
                                 value="#{programaBean.programa.nivelFormacion}"
                                 required="true"
                                 requiredMessage="Debe ingresar un nivel de formación"
                                 placeholder="Ejemplo: Tecnólogo, Técnico"
                                 style="width: 100%;"/>

                    <h:outputLabel value="Duración:" for="duracion" />
                    <p:inputText id="duracion"
                                 value="#{programaBean.programa.duracion}"
                                 required="true"
                                 requiredMessage="Debe ingresar una duración"
                                 placeholder="Ejemplo: 2 años, 6 meses"
                                 style="width: 100%;"/>

                    <h:outputLabel value="Jornada:" for="jornada" />
                    <p:selectOneMenu id="jornada" 
                                     value="#{programaBean.programa.jornadaId}" 
                                     required="true" 
                                     requiredMessage="Debe seleccionar una jornada"
                                     filter="true"
                                     style="width: 100%;">
                        <f:selectItem itemLabel="Seleccione una jornada" itemValue="0" />
                        <f:selectItems value="#{programaBean.jornadas}" 
                                      var="j"
                                      itemLabel="#{j.nombreJornada}" 
                                      itemValue="#{j.idJornada}" />
                    </p:selectOneMenu>

                    <h:outputLabel value="Modalidad:" for="modalidad" />
                    <p:selectOneMenu id="modalidad" 
                                     value="#{programaBean.programa.modalidadId}" 
                                     required="true" 
                                     requiredMessage="Debe seleccionar una modalidad"
                                     filter="true"
                                     style="width: 100%;">
                        <f:selectItem itemLabel="Seleccione una modalidad" itemValue="0" />
                        <f:selectItems value="#{programaBean.modalidades}" 
                                      var="m"
                                      itemLabel="#{m.nombreModalidad}" 
                                      itemValue="#{m.idModalidad}" />
                    </p:selectOneMenu>

                    <h:outputLabel value="Coordinación:" for="coordinacion" />
                    <p:selectOneMenu id="coordinacion" 
                                     value="#{programaBean.programa.coordinacionId}" 
                                     required="true" 
                                     requiredMessage="Debe seleccionar una coordinación"
                                     filter="true"
                                     style="width: 100%;">
                        <f:selectItem itemLabel="Seleccione una coordinación" itemValue="0" />
                        <f:selectItems value="#{programaBean.coordinaciones}" 
                                      var="c"
                                      itemLabel="#{c.nombreCoordinacion}" 
                                      itemValue="#{c.idCoordinacion}" />
                    </p:selectOneMenu>

                </h:panelGrid>

                <div class="form-actions">
                    <p:commandButton value="Guardar"
                                     action="#{programaBean.guardar}"
                                     icon="pi pi-save"
                                     ajax="false"
                                     styleClass="btn-primary"/>
                    <p:commandButton value="Cancelar"
                                     action="/pages/admin/listarProgramas.xhtml?faces-redirect=true"
                                     icon="pi pi-times"
                                     ajax="false"
                                     styleClass="btn-secondary"/>
                </div>

            </p:panel>
        </div>

    </h:form>

</h:body>
</html>
