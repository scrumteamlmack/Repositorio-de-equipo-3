<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Registrar Incidente - L-MACK</title>
    <link rel="stylesheet" type="text/css" href="#{facesContext.externalContext.requestContextPath}/resources/css/emac-style.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</h:head>

<h:body>

    <h:form id="formIncidente">

        <!-- NAVBAR -->
        <div class="navbar">
            <div class="title">L-MACK</div>
            <div class="menu">
                <p:commandButton value="Inicio"
                                 icon="pi pi-home"
                                 action="/pages/instructor/index.xhtml?faces-redirect=true"
                                 styleClass="btn btn-secondary"
                                 ajax="false"/>
                <p:menuButton value="Módulos" icon="pi pi-th-large" styleClass="btn btn-secondary">
                    <p:menuitem value="Mis Fichas"
                                icon="pi pi-file"
                                outcome="/pages/instructor/misFichas.xhtml"/>
                    <p:menuitem value="Asistencia"
                                icon="pi pi-check-circle"
                                outcome="/pages/asistencia/list.xhtml"/>
                    <p:menuitem value="Minutas"
                                icon="pi pi-file"
                                outcome="/pages/minutas/list.xhtml"/>
                    <p:menuitem value="Incidentes"
                                icon="pi pi-exclamation-triangle"
                                outcome="/pages/instructor/listarIncidentes.xhtml"/>
                </p:menuButton>
                <p:commandButton value="Mi Perfil"
                                 icon="pi pi-user"
                                 action="/pages/perfil.xhtml?faces-redirect=true"
                                 styleClass="btn btn-secondary"
                                 ajax="false"/>
                <p:commandButton value="Cerrar sesión"
                                 icon="pi pi-sign-out"
                                 action="#{loginBean.cerrarSesion}"
                                 styleClass="btn btn-secondary"
                                 ajax="false"/>
            </div>
        </div>

        <!-- CONTENIDO -->
        <div class="content">
            <f:metadata>
                <f:viewParam name="idIncidenteEditar" value="#{incidenteBean.idIncidenteEditar}">
                    <f:converter converterId="javax.faces.Integer" />
                </f:viewParam>
            </f:metadata>

            <div class="form-header">
                <h2>
                    <i class="pi pi-exclamation-triangle" style="margin-right: 10px;"></i>
                    #{incidenteBean.modoEdicion ? 'Editar Incidente' : 'Registrar Incidente'}
                </h2>
            </div>

            <p:messages showSummary="true" closable="true" severity="info,error,warn"/>

            <p:panel header="Datos del Incidente">
                <h:panelGrid columns="2" cellpadding="15" columnClasses="label-col, input-col">

                    <h:outputLabel value="Descripción:" for="descripcion" />
                    <p:inputTextarea id="descripcion" 
                                     value="#{incidenteBean.incidente.descripcion}" 
                                     required="true"
                                     requiredMessage="Debe ingresar una descripción"
                                     rows="4"
                                     cols="50"
                                     autoResize="false"
                                     style="width: 100%;"/>

                    <h:outputLabel value="Fecha del Incidente:" for="fecha" />
                    <p:calendar id="fecha"
                                value="#{incidenteBean.fechaDate}"
                                required="true"
                                requiredMessage="Debe seleccionar una fecha"
                                pattern="dd/MM/yyyy"
                                showIcon="true"
                                locale="es"
                                style="width: 100%;"/>

                    <h:outputLabel value="Hora del Incidente:" for="hora" />
                    <h:panelGroup>
                        <p:inputText id="hora"
                                      value="#{incidenteBean.horaString}"
                                      required="true"
                                      requiredMessage="Debe ingresar una hora"
                                      placeholder="HH:mm (ejemplo: 14:30)"
                                      style="width: 100%;">
                            <f:validateRegex pattern="^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$" />
                        </p:inputText>
                        <h:outputText value="Formato: HH:mm (ejemplo: 14:30)" style="font-size: 0.85em; color: #666; display: block; margin-top: 5px;"/>
                    </h:panelGroup>

                    <h:outputLabel value="Ambiente:" for="ambiente" />
                    <p:selectOneMenu id="ambiente" 
                                     value="#{incidenteBean.incidente.idAmbiente}" 
                                     required="true" 
                                     requiredMessage="Debe seleccionar un ambiente"
                                     filter="true"
                                     style="width: 100%;">
                        <f:selectItem itemLabel="Seleccione un ambiente" itemValue="0" />
                        <f:selectItems value="#{incidenteBean.ambientes}" 
                                      var="amb"
                                      itemLabel="Ambiente #{amb.numero} - #{amb.tipo}" 
                                      itemValue="#{amb.idAmbiente}" />
                    </p:selectOneMenu>

                    <h:outputLabel value="Tipo de Incidente:" for="tipoIncidente" />
                    <p:selectOneMenu id="tipoIncidente" 
                                     value="#{incidenteBean.incidente.idTipoIncidente}" 
                                     required="true" 
                                     requiredMessage="Debe seleccionar un tipo de incidente"
                                     filter="true"
                                     style="width: 100%;">
                        <f:selectItem itemLabel="Seleccione un tipo de incidente" itemValue="0" />
                        <f:selectItems value="#{incidenteBean.tiposIncidente}" 
                                      var="tipo"
                                      itemLabel="#{tipo.nombre}" 
                                      itemValue="#{tipo.idTipoIncidente}" />
                    </p:selectOneMenu>

                    <h:outputLabel value="Instructor Reportador:" for="reportador" />
                    <h:panelGroup>
                        <h:outputText value="#{incidenteBean.nombreReportador}" 
                                     style="font-weight: bold; color: var(--primary-green);"/>
                        <h:outputText value=" (Asignado automáticamente)" 
                                     style="font-size: 0.85em; color: #666; margin-left: 5px;"/>
                    </h:panelGroup>

                </h:panelGrid>

                <div class="form-actions">
                    <p:commandButton value="Guardar"
                                     action="#{incidenteBean.guardar}"
                                     icon="pi pi-save"
                                     ajax="false"
                                     styleClass="btn-primary"/>
                    <p:commandButton value="Cancelar"
                                     action="/pages/instructor/listarIncidentes.xhtml?faces-redirect=true"
                                     icon="pi pi-times"
                                     ajax="false"
                                     styleClass="btn-secondary"/>
                </div>

            </p:panel>
        </div>

    </h:form>

</h:body>
</html>
