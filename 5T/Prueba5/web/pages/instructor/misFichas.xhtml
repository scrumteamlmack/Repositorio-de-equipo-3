<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Mis Fichas - L-MACK</title>
    <link rel="stylesheet" type="text/css" href="#{facesContext.externalContext.requestContextPath}/resources/css/emac-style.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</h:head>

<h:body>

    <h:form id="formMisFichas">

        <!-- NAVBAR -->
        <div class="navbar">
            <div class="title">L-MACK</div>
            <div class="menu">
                <p:commandButton value="Inicio"
                                 icon="pi pi-home"
                                 action="/pages/instructor/index.xhtml?faces-redirect=true"
                                 styleClass="btn btn-secondary"
                                 ajax="false"/>
                <p:menuButton value="Módulos" icon="pi pi-th-large" styleClass="btn btn-secondary">
                    <p:menuitem value="Mis Fichas"
                                icon="pi pi-file"
                                outcome="/pages/instructor/misFichas.xhtml"/>
                    <p:menuitem value="Asistencia"
                                icon="pi pi-check-circle"
                                outcome="/pages/asistencia/list.xhtml"/>
                    <p:menuitem value="Minutas"
                                icon="pi pi-file"
                                outcome="/pages/minutas/list.xhtml"/>
                    <p:menuitem value="Incidentes"
                                icon="pi pi-exclamation-triangle"
                                outcome="/pages/incidentes/list.xhtml"/>
                </p:menuButton>
                <p:commandButton value="Cerrar sesión"
                                 icon="pi pi-sign-out"
                                 action="#{loginBean.cerrarSesion}"
                                 styleClass="btn btn-secondary"
                                 ajax="false"/>
            </div>
        </div>

        <!-- CONTENIDO -->
        <div class="content">
            <f:metadata>
                <f:event type="preRenderView" listener="#{fichaBean.init}" />
            </f:metadata>
            
            <div class="form-header">
                <h2>Mis Fichas Asignadas</h2>
            </div>
            
            <p:messages showSummary="true" closable="true" severity="info,error,warn"/>

            <div class="table-container">
                <p:dataTable value="#{fichaBean.fichasInstructor}" var="f" 
                             emptyMessage="No tienes fichas asignadas"
                             paginator="true" rows="10"
                             paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
                             rowsPerPageTemplate="5,10,15,20"
                             styleClass="table table-striped table-hover">

                    <p:column headerText="Número de Ficha" style="width: 150px;">
                        <h:outputText value="#{f.numFicha}" />
                    </p:column>

                    <p:column headerText="Aprendices Registrados" style="width: 200px;">
                        <h:outputText value="#{aprendizBean.contarAprendicesPorFicha(f.idFicha)} aprendices" />
                    </p:column>

                    <p:column headerText="Acciones" style="width: 150px;">
                        <p:commandButton value="Ver Aprendices"
                                         icon="pi pi-users"
                                         action="#{fichaBean.verAprendices(f.idFicha)}"
                                         styleClass="btn btn-sm btn-primary"
                                         ajax="false"/>
                    </p:column>

                </p:dataTable>
            </div>

        </div>

    </h:form>

</h:body>
</html>
