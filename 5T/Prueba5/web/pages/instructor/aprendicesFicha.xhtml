<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Aprendices de la Ficha - L-MACK</title>
    <link rel="stylesheet" type="text/css" href="#{facesContext.externalContext.requestContextPath}/resources/css/emac-style.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        /* Estilos unificados para paginador */
        .ui-paginator {
            background: transparent !important;
            border: none !important;
            padding: 15px 0 !important;
        }
        .ui-paginator .ui-paginator-page,
        .ui-paginator .ui-paginator-first,
        .ui-paginator .ui-paginator-prev,
        .ui-paginator .ui-paginator-next,
        .ui-paginator .ui-paginator-last {
            background: #f8f9fa !important;
            border: 1px solid #dee2e6 !important;
            color: #495057 !important;
            min-width: 2.5rem !important;
            height: 2.5rem !important;
            border-radius: 6px !important;
            margin: 0 2px !important;
        }
        .ui-paginator .ui-paginator-page.ui-state-active {
            background: var(--primary-green) !important;
            border-color: var(--primary-green) !important;
            color: white !important;
        }
        .ui-paginator .ui-paginator-page:hover,
        .ui-paginator .ui-paginator-first:hover,
        .ui-paginator .ui-paginator-prev:hover,
        .ui-paginator .ui-paginator-next:hover,
        .ui-paginator .ui-paginator-last:hover {
            background: #e9ecef !important;
        }
        .ui-paginator-rpp-options {
            border: 1px solid #dee2e6 !important;
            border-radius: 6px !important;
            padding: 5px 10px !important;
        }
    </style>
</h:head>

<h:body>
    <f:metadata>
        <f:viewParam name="fichaId" value="#{fichaBean.idFichaEditar}">
            <f:converter converterId="javax.faces.Integer" />
        </f:viewParam>
        <f:event type="preRenderView" listener="#{fichaBean.init}" />
    </f:metadata>

    <h:form id="formAprendices">

        <!-- NAVBAR -->
        <div class="navbar">
            <div class="title">L-MACK</div>
            <div class="menu">
                <p:commandButton value="Inicio"
                                 icon="pi pi-home"
                                 action="/pages/instructor/index.xhtml?faces-redirect=true"
                                 styleClass="btn btn-secondary"
                                 ajax="false"/>
                <p:commandButton value="Mis Fichas"
                                 icon="pi pi-file"
                                 action="/pages/instructor/misFichas.xhtml?faces-redirect=true"
                                 styleClass="btn btn-secondary"
                                 ajax="false"/>
                <p:commandButton value="Cerrar sesión"
                                 icon="pi pi-sign-out"
                                 action="#{loginBean.cerrarSesion}"
                                 styleClass="btn btn-secondary"
                                 ajax="false"/>
            </div>
        </div>

        <!-- CONTENIDO -->
        <div class="content">
            <div class="form-header">
                <h2>Aprendices de la Ficha #{fichaBean.ficha != null ? fichaBean.ficha.numFicha : fichaBean.idFichaEditar}</h2>
            </div>
            
            <p:messages showSummary="true" closable="true" severity="info,error,warn"/>

            <div class="table-container">
                <p:dataTable value="#{aprendizBean.getAprendicesPorFicha(fichaBean.idFichaEditar != null ? fichaBean.idFichaEditar : 0)}" var="a" 
                             emptyMessage="No hay aprendices registrados en esta ficha"
                             paginator="true" rows="10"
                             paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}"
                             rowsPerPageTemplate="5,10,15,20"
                             styleClass="table table-striped table-hover">

                    <p:column headerText="ID" style="width: 60px;">
                        <h:outputText value="#{a.idUsuario}" />
                    </p:column>

                    <p:column headerText="Nombre Completo">
                        <h:outputText value="#{aprendizBean.getNombreAprendiz(a.idUsuario)}" />
                    </p:column>

                    <p:column headerText="Programa">
                        <h:outputText value="#{aprendizBean.getNombrePrograma(a.programaId)}" />
                    </p:column>

                </p:dataTable>
            </div>

        </div>

    </h:form>

</h:body>
</html>
