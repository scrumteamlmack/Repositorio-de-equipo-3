<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Sesión Cerrada - L-MACK</title>
    <link rel="stylesheet" type="text/css" href="#{facesContext.externalContext.requestContextPath}/resources/css/emac-style.css"/>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
    <meta http-equiv="Pragma" content="no-cache"/>
    <meta http-equiv="Expires" content="0"/>
    <script type="text/javascript">
        // Prevenir que el botón atrás funcione - mantener siempre en esta página
        (function() {
            // Reemplazar la entrada actual del historial
            if (window.history && window.history.replaceState) {
                window.history.replaceState(null, null, window.location.href);
            }
            
            // Agregar una entrada al historial para que el botón atrás siempre vuelva aquí
            if (window.history && window.history.pushState) {
                window.history.pushState(null, null, window.location.href);
            }
            
            // Interceptar el botón atrás
            window.addEventListener('popstate', function(event) {
                // Siempre redirigir de vuelta a esta página
                window.history.pushState(null, null, window.location.href);
            });
        })();
    </script>
    <style>
        .logout-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--cream-bg);
            padding: 20px;
        }
        
        .logout-card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        
        .logout-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        .logout-title {
            font-size: 24px;
            color: var(--primary-green);
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .logout-message {
            font-size: 16px;
            color: #6c757d;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .btn-login {
            display: inline-block;
            padding: 12px 30px;
            background-color: var(--primary-green);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .btn-login:hover {
            background-color: var(--dark-green);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(45, 134, 89, 0.3);
        }
    </style>
</h:head>

<h:body>
    <div class="logout-container">
        <div class="logout-card">
            <div class="logout-icon">🔒</div>
            <h1 class="logout-title">Sesión Cerrada</h1>
            <p class="logout-message">
                No has iniciado sesión correctamente.<br/>
                Por favor, inicia sesión para acceder al sistema.
            </p>
            <h:link outcome="/faces/login.xhtml" styleClass="btn-login" value="Iniciar Sesión"/>
        </div>
    </div>
</h:body>
</html>
