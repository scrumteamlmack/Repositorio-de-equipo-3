<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Gestión de Recursos - L-MACK</title>
    <link rel="stylesheet" type="text/css" href="#{facesContext.externalContext.requestContextPath}/resources/css/emac-style.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        .layout-container {
            display: flex;
            min-height: 100vh;
            background-color: var(--cream-bg);
        }
        
        .sidebar {
            width: 260px;
            background-color: var(--primary-green);
            color: white;
            padding: 0;
            box-shadow: 2px 0 8px rgba(0,0,0,0.1);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            padding: 25px 20px;
            background-color: var(--dark-green);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .sidebar-header h3 {
            color: white;
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .sidebar-header h3::before {
            content: "👤";
            font-size: 28px;
        }
        
        .sidebar-nav {
            padding: 20px 0;
            flex: 1;
        }
        
        .sidebar-nav a {
            display: block;
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            padding: 15px 25px;
            transition: all 0.3s;
            border-left: 3px solid transparent;
            font-size: 15px;
        }
        
        .sidebar-nav a:hover {
            background: rgba(255,255,255,0.1);
            border-left-color: var(--light-green);
            color: white;
            padding-left: 30px;
        }
        
        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: auto;
        }
        
        .sidebar-footer .btn-logout {
            width: 100%;
            padding: 12px 20px;
            background-color: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .sidebar-footer .btn-logout:hover {
            background-color: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.3);
        }
        
        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 20px;
            min-height: 100vh;
            background-color: var(--cream-bg);
        }
        
        .content-wrapper {
            background: var(--white);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
        }
        .badge.bg-success { background: #dcfce7 !important; color: #15803d !important; }
        .badge.bg-warning { background: #fef3c7 !important; color: #92400e !important; }
        .badge.bg-danger { background: #fee2e2 !important; color: #b91c1c !important; }
    </style>
</h:head>

<h:body>
    <f:metadata>
        <f:viewAction action="#{loginBean.verificarSesion(1)}"/>
    </f:metadata>

    <div class="layout-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>L-MACK</h3>
            </div>
            <nav class="sidebar-nav">
                <h:link outcome="/pages/admin/indexAdmin.xhtml" value="🏠 Inicio" styleClass="sidebar-link"/>
                <h:link outcome="/pages/admin/listarUsuarios.xhtml" value="👥 Usuarios" styleClass="sidebar-link"/>
                <h:link outcome="/pages/admin/formUsuario.xhtml" value="➕ Crear Usuario" styleClass="sidebar-link"/>
                <h:link outcome="/pages/admin/listarFichas.xhtml" value="📁 Fichas" styleClass="sidebar-link"/>
                <h:link outcome="/pages/admin/listarProgramas.xhtml" value="📚 Programas" styleClass="sidebar-link"/>
                <h:link outcome="/pages/admin/listarRecursos.xhtml" value="💻 Recursos" styleClass="sidebar-link"/>
                <h:link outcome="/pages/admin/listarAmbientes.xhtml" value="🏢 Ambientes" styleClass="sidebar-link"/>
                <h:link outcome="/pages/perfil.xhtml" value="👤 Mi Perfil" styleClass="sidebar-link"/>
            </nav>
            <div class="sidebar-footer">
                <h:form>
                    <p:commandButton value="Cerrar sesión"
                                     icon="pi pi-sign-out"
                                     action="#{loginBean.cerrarSesion}"
                                     styleClass="btn-logout"
                                     ajax="false"/>
                </h:form>
            </div>
        </aside>
        
        <main class="main-content">
            <div class="content-wrapper">
                <div class="form-header">
                    <h2><i class="pi pi-desktop" style="margin-right: 10px;"></i>Gestión de Recursos</h2>
                </div>
                
                <p:messages showSummary="true" closable="true" severity="info,error,warn"/>

                <h:form id="formRecursos">
                    <div style="margin-bottom: 20px;">
                        <p:commandButton value="➕ Nuevo Recurso"
                                         styleClass="btn btn-primary"
                                         actionListener="#{recursoBean.prepararNuevo}"
                                         update="dialogRecurso"
                                         oncomplete="PF('dlgRecurso').show()"
                                         ajax="false"/>
                    </div>

                    <p:toolbar style="margin-bottom: 10px;">
                        <f:facet name="left">
                            <p:commandButton value="📄 Exportar PDF"
                                             icon="pi pi-file-pdf"
                                             styleClass="btn-primary"
                                             ajax="false"
                                             onclick="PF('tablaRecursos').exportToPdf();"/>
                            <p:commandButton value="📊 Exportar Excel"
                                             icon="pi pi-file-excel"
                                             styleClass="btn-success"
                                             ajax="false"
                                             onclick="PF('tablaRecursos').exportToXls();"/>
                        </f:facet>
                    </p:toolbar>

                    <p:dataTable id="tablaRecursos" 
                                 value="#{recursoBean.recursos}" 
                                 var="rec"
                                 filteredValue="#{recursoBean.recursosFiltrados}"
                                 emptyMessage="No hay recursos registrados"
                                 paginator="true" 
                                 rows="10"
                                 paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
                                 rowsPerPageTemplate="5,10,15,20"
                                 styleClass="table table-striped table-hover"
                                 exportable="true">

                        <p:column headerText="ID" 
                                 filterBy="#{rec.idRecurso}" 
                                 filterMatchMode="exact"
                                 style="width: 80px;">
                            <h:outputText value="#{rec.idRecurso}" />
                        </p:column>

                        <p:column headerText="Nombre" 
                                 filterBy="#{rec.nombre}" 
                                 filterMatchMode="contains"
                                 style="width: 200px;">
                            <h:outputText value="#{rec.nombre}" />
                        </p:column>

                        <p:column headerText="Serial" 
                                 filterBy="#{rec.serial}" 
                                 filterMatchMode="contains"
                                 style="width: 150px;">
                            <h:outputText value="#{rec.serial}" />
                        </p:column>

                        <p:column headerText="Número" 
                                 filterBy="#{rec.numero}" 
                                 filterMatchMode="contains"
                                 style="width: 100px;">
                            <h:outputText value="#{rec.numero}" />
                        </p:column>

                        <p:column headerText="Tipo" 
                                 filterBy="#{rec.idTipoRecurso}" 
                                 filterMatchMode="contains"
                                 style="width: 120px;">
                            <h:outputText value="#{rec.idTipoRecurso}" />
                        </p:column>

                        <p:column headerText="Estado" 
                                 filterBy="#{rec.estado}" 
                                 filterMatchMode="contains"
                                 style="width: 150px;">
                            <span class="badge #{rec.estado == 'Disponible' or rec.estado == 'Operativo' ? 'bg-success' : rec.estado == 'Dañado' ? 'bg-danger' : 'bg-warning'}">
                                #{rec.estado}
                            </span>
                        </p:column>

                        <p:column headerText="Ambiente" 
                                 filterBy="#{rec.idAmbiente}" 
                                 filterMatchMode="contains"
                                 style="width: 100px;">
                            <h:outputText value="#{rec.idAmbiente}" />
                        </p:column>

                        <p:column headerText="Observación" 
                                 filterBy="#{rec.observacion}" 
                                 filterMatchMode="contains"
                                 style="width: 200px;">
                            <h:outputText value="#{rec.observacion != null ? rec.observacion : '—'}" />
                        </p:column>

                        <p:column headerText="Acciones" 
                                 style="width: 200px;"
                                 exportable="false">
                            <div style="display: flex; gap: 5px;">
                                <p:commandButton value="Editar"
                                                 styleClass="btn btn-sm btn-primary"
                                                 actionListener="#{recursoBean.editar(rec.idRecurso)}"
                                                 update="dialogRecurso"
                                                 oncomplete="PF('dlgRecurso').show()"
                                                 ajax="false"/>
                                <p:commandButton value="Eliminar"
                                                 styleClass="btn btn-sm btn-danger"
                                                 actionListener="#{recursoBean.eliminar(rec.idRecurso)}"
                                                 update="tablaRecursos"
                                                 onclick="return confirm('¿Seguro que deseas eliminar este recurso?');"
                                                 ajax="false"/>
                            </div>
                        </p:column>

                    </p:dataTable>
                </h:form>

                <p:dialog widgetVar="dlgRecurso" header="Recurso" modal="true" width="650"
                          resizable="false" id="dialogRecurso">
                    <h:form styleClass="ui-fluid">
                        <p:panelGrid columns="2" columnClasses="col, col">
                            <p:outputLabel value="Nombre"/>
                            <p:inputText value="#{recursoBean.recurso.nombre}" required="true"/>

                            <p:outputLabel value="Tipo de recurso"/>
                            <p:selectOneMenu value="#{recursoBean.recurso.idTipoRecurso}" required="true" filter="true">
                                <f:selectItems value="#{recursoBean.tipos}" var="tipo"
                                               itemLabel="#{tipo.nombre}" itemValue="#{tipo.idTipoRecurso}"/>
                            </p:selectOneMenu>

                            <p:outputLabel value="Ambiente"/>
                            <p:selectOneMenu value="#{recursoBean.recurso.idAmbiente}" filter="true" required="true">
                                <f:selectItems value="#{recursoBean.ambientes}" var="amb"
                                               itemLabel="#{amb.numero} - #{amb.tipo}"
                                               itemValue="#{amb.idAmbiente}"/>
                            </p:selectOneMenu>

                            <p:outputLabel value="Número"/>
                            <p:inputNumber value="#{recursoBean.recurso.numero}" required="true"/>

                            <p:outputLabel value="Serial"/>
                            <p:inputText value="#{recursoBean.recurso.serial}" required="true"/>

                            <p:outputLabel value="Estado"/>
                            <p:selectOneMenu value="#{recursoBean.recurso.estado}" required="true">
                                <f:selectItem itemLabel="Disponible" itemValue="Disponible"/>
                                <f:selectItem itemLabel="En mantenimiento" itemValue="En mantenimiento"/>
                                <f:selectItem itemLabel="Dañado" itemValue="Dañado"/>
                            </p:selectOneMenu>

                            <p:outputLabel value="Observación"/>
                            <p:inputTextarea value="#{recursoBean.recurso.observacion}" autoResize="false"/>
                        </p:panelGrid>

                        <p:commandButton value="Guardar" actionListener="#{recursoBean.guardar}"
                                         update=":formRecursos"
                                         oncomplete="PF('dlgRecurso').hide()"
                                         styleClass="ui-button-success"
                                         ajax="false"/>
                        <p:commandButton value="Cancelar" onclick="PF('dlgRecurso').hide()"
                                         styleClass="btn-secondary"/>
                    </h:form>
                </p:dialog>
            </div>
        </main>
    </div>

</h:body>
</html>
