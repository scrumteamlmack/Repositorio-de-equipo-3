<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Listar Fichas - L-MACK</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
    <meta http-equiv="Pragma" content="no-cache"/>
    <meta http-equiv="Expires" content="0"/>
    <link rel="stylesheet" type="text/css" href="#{facesContext.externalContext.requestContextPath}/resources/css/emac-style.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        .layout-container {
            display: flex;
            min-height: 100vh;
            background-color: var(--cream-bg);
        }
        
        .sidebar {
            width: 260px;
            background-color: var(--primary-green);
            color: white;
            padding: 0;
            box-shadow: 2px 0 8px rgba(0,0,0,0.1);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            padding: 25px 20px;
            background-color: var(--dark-green);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .sidebar-header h3 {
            color: white;
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .sidebar-header h3::before {
            content: "👤";
            font-size: 28px;
        }
        
        .sidebar-nav {
            padding: 20px 0;
            flex: 1;
        }
        
        .sidebar-nav a {
            display: block;
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            padding: 15px 25px;
            transition: all 0.3s;
            border-left: 3px solid transparent;
            font-size: 15px;
        }
        
        .sidebar-nav a:hover {
            background: rgba(255,255,255,0.1);
            border-left-color: var(--light-green);
            color: white;
            padding-left: 30px;
        }
        
        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: auto;
        }
        
        .sidebar-footer .btn-logout {
            width: 100%;
            padding: 12px 20px;
            background-color: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .sidebar-footer .btn-logout:hover {
            background-color: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.3);
        }
        
        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 20px;
            min-height: 100vh;
            background-color: var(--cream-bg);
        }
        
        .content-wrapper {
            background: var(--white);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
    </style>
</h:head>

<h:body>
    <f:metadata>
        <f:viewAction action="#{loginBean.verificarSesionAdmin}"/>
    </f:metadata>

    <div class="layout-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>L-MACK</h3>
            </div>
            <nav class="sidebar-nav">
                <h:link outcome="/pages/admin/indexAdmin.xhtml" value="🏠 Inicio" styleClass="sidebar-link"/>
                <h:link outcome="/pages/admin/listarUsuarios.xhtml" value="👥 Usuarios" styleClass="sidebar-link"/>
                <h:link outcome="/pages/admin/formUsuario.xhtml" value="➕ Crear Usuario" styleClass="sidebar-link"/>
                <h:link outcome="/pages/admin/listarFichas.xhtml" value="📁 Fichas" styleClass="sidebar-link"/>
                <h:link outcome="/pages/admin/listarProgramas.xhtml" value="📚 Programas" styleClass="sidebar-link"/>
                <h:link outcome="/pages/admin/listarRecursos.xhtml" value="💻 Recursos" styleClass="sidebar-link"/>
                <h:link outcome="/pages/admin/listarAmbientes.xhtml" value="🏢 Ambientes" styleClass="sidebar-link"/>
                <h:link outcome="/pages/perfil.xhtml" value="👤 Mi Perfil" styleClass="sidebar-link"/>
            </nav>
            <div class="sidebar-footer">
                <h:form>
                    <p:commandButton value="Cerrar sesión"
                                     icon="pi pi-sign-out"
                                     action="#{loginBean.cerrarSesion}"
                                     styleClass="btn-logout"
                                     ajax="false"/>
                </h:form>
            </div>
        </aside>
        
        <main class="main-content">
            <div class="content-wrapper">
                <h:form id="formListar">
            <div class="form-header">
                <h2><i class="pi pi-file" style="margin-right: 10px;"></i>Lista de Fichas</h2>
            </div>

            <p:messages showSummary="true" closable="true" severity="info,error,warn"/>

            <div style="margin-bottom: 20px;">
                <p:commandButton value="➕ Nueva Ficha"
                                 action="#{fichaBean.prepararNuevo}"
                                 icon="pi pi-plus"
                                 styleClass="btn btn-primary"
                                 ajax="false"/>
            </div>

            <div class="table-container">
                <p:dataTable value="#{fichaBean.fichasAgrupadas}" var="f" 
                             emptyMessage="No hay fichas registradas"
                             paginator="true" rows="10"
                             paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
                             rowsPerPageTemplate="5,10,15,20"
                             styleClass="table table-striped table-hover">

                    <p:column headerText="Número de Ficha" style="width: 150px;">
                        <h:outputText value="#{f.numFicha}" />
                    </p:column>

                    <p:column headerText="Instructores Asignados">
                        <h:panelGroup>
                            <h:outputText value="#{fichaBean.getNombreInstructor(fichaBean.getInstructoresDeFicha(f.numFicha).get(0))}" rendered="#{fichaBean.getInstructoresDeFicha(f.numFicha).size() > 0}"/>
                            <h:outputText value=", " rendered="#{fichaBean.getInstructoresDeFicha(f.numFicha).size() > 1}"/>
                            <h:outputText value="#{fichaBean.getNombreInstructor(fichaBean.getInstructoresDeFicha(f.numFicha).get(1))}" rendered="#{fichaBean.getInstructoresDeFicha(f.numFicha).size() > 1}"/>
                            <h:outputText value=" y #{fichaBean.getInstructoresDeFicha(f.numFicha).size() - 2} más" rendered="#{fichaBean.getInstructoresDeFicha(f.numFicha).size() > 2}"/>
                        </h:panelGroup>
                    </p:column>

                    <p:column headerText="Cantidad Instructores" style="width: 150px;">
                        <h:outputText value="#{fichaBean.getInstructoresDeFicha(f.numFicha).size()}" />
                    </p:column>

                    <p:column headerText="Acciones" style="width: 150px;">
                        <div style="display: flex; gap: 5px;">
                            <p:commandButton icon="pi pi-pencil"
                                             title="Editar"
                                             action="#{fichaBean.editar(f.idFicha)}"
                                             ajax="false"
                                             styleClass="btn btn-sm btn-secondary"/>
                            <p:commandButton icon="pi pi-trash"
                                             title="Eliminar"
                                             actionListener="#{fichaBean.eliminar(f.idFicha)}"
                                             update="@form"
                                             styleClass="btn btn-sm btn-danger"
                                             onclick="return confirm('¿Está seguro de eliminar esta ficha?');"/>
                        </div>
                    </p:column>

                </p:dataTable>
                </div>
                </h:form>
            </div>
        </main>
    </div>
</h:body>
</html>
