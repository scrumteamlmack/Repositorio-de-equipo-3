<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>#{trasladoRecursoBean.modoEdicion ? 'Editar Traslado' : 'Registrar Traslado'} - L-MACK</title>
    <link rel="stylesheet" type="text/css" href="#{facesContext.externalContext.requestContextPath}/resources/css/emac-style.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        .layout-container {
            display: flex;
            min-height: 100vh;
            background-color: var(--cream-bg);
        }
        
        .sidebar {
            width: 260px;
            background-color: var(--primary-green);
            color: white;
            padding: 0;
            box-shadow: 2px 0 8px rgba(0,0,0,0.1);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            padding: 25px 20px;
            background-color: var(--dark-green);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .sidebar-header h3 {
            color: white;
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .sidebar-header h3::before {
            content: "👤";
            font-size: 28px;
        }
        
        .sidebar-nav {
            padding: 20px 0;
            flex: 1;
        }
        
        .sidebar-nav a {
            display: block;
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            padding: 15px 25px;
            transition: all 0.3s;
            border-left: 3px solid transparent;
            font-size: 15px;
        }
        
        .sidebar-nav a:hover {
            background: rgba(255,255,255,0.1);
            border-left-color: var(--light-green);
            color: white;
            padding-left: 30px;
        }
        
        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: auto;
        }
        
        .sidebar-footer .btn-logout {
            width: 100%;
            padding: 12px 20px;
            background-color: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .sidebar-footer .btn-logout:hover {
            background-color: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.3);
        }
        
        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 20px;
            min-height: 100vh;
            background-color: var(--cream-bg);
        }
        
        .content-wrapper {
            background: var(--white);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
    </style>
</h:head>

<h:body>
    <f:metadata>
        <f:viewParam name="idTrasladoEditar" value="#{trasladoRecursoBean.idTrasladoEditar}">
            <f:converter converterId="javax.faces.Integer" />
        </f:viewParam>
        <f:event type="preRenderView" listener="#{trasladoRecursoBean.init}"/>
    </f:metadata>

    <div class="layout-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>L-MACK</h3>
            </div>
            <nav class="sidebar-nav">
                <h:link outcome="/pages/instructor/index.xhtml" value="🏠 Inicio" styleClass="sidebar-link"/>
                <h:link outcome="/pages/instructor/misFichas.xhtml" value="📁 Mis Fichas" styleClass="sidebar-link"/>
                <h:link outcome="/pages/instructor/asistencias/listarAsistencias.xhtml" value="📋 Asistencia" styleClass="sidebar-link"/>
                <h:link outcome="/pages/minutas/list.xhtml" value="📝 Minutas" styleClass="sidebar-link"/>
                <h:link outcome="/pages/instructor/listarIncidentes.xhtml" value="⚠️ Incidentes" styleClass="sidebar-link"/>
                <h:link outcome="/pages/instructor/traslados/listarTraslados.xhtml" value="🚚 Traslados" styleClass="sidebar-link"/>
                <h:link outcome="/pages/instructor/consultarAmbientes.xhtml" value="🏢 Ambientes" styleClass="sidebar-link"/>
                <h:link outcome="/pages/perfil.xhtml" value="👤 Mi Perfil" styleClass="sidebar-link"/>
            </nav>
            <div class="sidebar-footer">
                <h:form>
                    <p:commandButton value="Cerrar sesión"
                                     icon="pi pi-sign-out"
                                     action="#{loginBean.cerrarSesion}"
                                     styleClass="btn-logout"
                                     ajax="false"/>
                </h:form>
            </div>
        </aside>
        
        <main class="main-content">
            <div class="content-wrapper">
                <div class="form-header">
                    <h2>
                        <i class="pi pi-truck" style="margin-right: 10px;"></i>
                        #{trasladoRecursoBean.modoEdicion ? 'Editar Traslado' : 'Registrar Traslado'}
                    </h2>
                </div>

                <p:messages showSummary="true" closable="true" severity="info,error,warn"/>

                <h:form id="formTraslado">
                    <p:panel header="Datos del Traslado">
                        <h:panelGrid columns="2" cellpadding="15" columnClasses="label-col, input-col">

                            <h:outputLabel value="Recurso:" for="recurso" />
                            <p:selectOneMenu id="recurso" 
                                             value="#{trasladoRecursoBean.traslado.recursoId}" 
                                             required="true" 
                                             requiredMessage="Debe seleccionar un recurso"
                                             filter="true"
                                             style="width: 100%;">
                                <f:selectItem itemLabel="Seleccione un recurso" itemValue="0" />
                                <f:selectItems value="#{trasladoRecursoBean.recursos}" 
                                              var="rec"
                                              itemLabel="#{rec.nombre} (Serial: #{rec.serial})" 
                                              itemValue="#{rec.idRecurso}" />
                            </p:selectOneMenu>

                            <h:outputLabel value="Ambiente Origen:" for="ambienteOrigen" />
                            <p:selectOneMenu id="ambienteOrigen" 
                                             value="#{trasladoRecursoBean.traslado.ambienteOrigen}" 
                                             required="true" 
                                             requiredMessage="Debe seleccionar un ambiente de origen"
                                             filter="true"
                                             style="width: 100%;">
                                <f:selectItem itemLabel="Seleccione un ambiente origen" itemValue="0" />
                                <f:selectItems value="#{trasladoRecursoBean.ambientes}" 
                                              var="amb"
                                              itemLabel="Ambiente #{amb.numero} - #{amb.tipo}" 
                                              itemValue="#{amb.idAmbiente}" />
                            </p:selectOneMenu>

                            <h:outputLabel value="Ambiente Destino:" for="ambienteDestino" />
                            <p:selectOneMenu id="ambienteDestino" 
                                             value="#{trasladoRecursoBean.traslado.ambienteDestino}" 
                                             required="true" 
                                             requiredMessage="Debe seleccionar un ambiente de destino"
                                             filter="true"
                                             style="width: 100%;">
                                <f:selectItem itemLabel="Seleccione un ambiente destino" itemValue="0" />
                                <f:selectItems value="#{trasladoRecursoBean.ambientes}" 
                                              var="amb"
                                              itemLabel="Ambiente #{amb.numero} - #{amb.tipo}" 
                                              itemValue="#{amb.idAmbiente}" />
                            </p:selectOneMenu>

                            <h:outputLabel value="Fecha y Hora del Traslado: *" for="fechaTraslado" />
                            <h:panelGroup>
                                <p:calendar id="fechaTraslado"
                                            value="#{trasladoRecursoBean.fechaTrasladoDate}"
                                            required="true"
                                            requiredMessage="Debe seleccionar fecha y hora del traslado"
                                            pattern="dd/MM/yyyy HH:mm"
                                            showIcon="true"
                                            showTime="true"
                                            locale="es"
                                            mindate="#{java.util.Date()}"
                                            maxdate="#{java.util.Date()}"
                                            style="width: 100%;"/>
                                <p:message for="fechaTraslado" display="text" styleClass="text-danger"/>
                                <h:outputText value="Solo se permite la fecha de hoy" style="font-size: 0.85em; color: #666; display: block;"/>
                            </h:panelGroup>

                            <h:outputLabel value="Observación:" for="observacion" />
                            <p:inputTextarea id="observacion" 
                                             value="#{trasladoRecursoBean.traslado.observacion}" 
                                             rows="4"
                                             cols="50"
                                             autoResize="false"
                                             style="width: 100%;"/>

                        </h:panelGrid>

                        <div class="form-actions" style="margin-top: 20px;">
                            <p:commandButton value="Guardar"
                                             action="#{trasladoRecursoBean.guardar}"
                                             icon="pi pi-save"
                                             ajax="false"
                                             styleClass="btn-primary"/>
                            <p:commandButton value="Cancelar"
                                             action="/pages/instructor/traslados/listarTraslados.xhtml?faces-redirect=true"
                                             icon="pi pi-times"
                                             ajax="false"
                                             styleClass="btn-secondary"/>
                        </div>

                    </p:panel>
                </h:form>
            </div>
        </main>
    </div>

</h:body>
</html>
