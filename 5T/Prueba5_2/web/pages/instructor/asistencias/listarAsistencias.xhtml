<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Asistencias - L-MACK</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
    <meta http-equiv="Pragma" content="no-cache"/>
    <meta http-equiv="Expires" content="0"/>
    <link rel="stylesheet" type="text/css" href="#{facesContext.externalContext.requestContextPath}/resources/css/emac-style.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        .layout-container {
            display: flex;
            min-height: 100vh;
            background-color: var(--cream-bg);
        }
        
        .sidebar {
            width: 260px;
            background-color: var(--primary-green);
            color: white;
            padding: 0;
            box-shadow: 2px 0 8px rgba(0,0,0,0.1);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            padding: 25px 20px;
            background-color: var(--dark-green);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .sidebar-header h3 {
            color: white;
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .sidebar-header h3::before {
            content: "👤";
            font-size: 28px;
        }
        
        .sidebar-nav {
            padding: 20px 0;
            flex: 1;
        }
        
        .sidebar-nav a {
            display: block;
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            padding: 15px 25px;
            transition: all 0.3s;
            border-left: 3px solid transparent;
            font-size: 15px;
        }
        
        .sidebar-nav a:hover {
            background: rgba(255,255,255,0.1);
            border-left-color: var(--light-green);
            color: white;
            padding-left: 30px;
        }
        
        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: auto;
        }
        
        .sidebar-footer .btn-logout {
            width: 100%;
            padding: 12px 20px;
            background-color: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .sidebar-footer .btn-logout:hover {
            background-color: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.3);
        }
        
        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 20px;
            min-height: 100vh;
            background-color: var(--cream-bg);
        }
        
        .content-wrapper {
            background: var(--white);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
        }
        .badge.bg-success { background: #dcfce7 !important; color: #15803d !important; }
        .badge.bg-warning { background: #fef3c7 !important; color: #92400e !important; }
        .badge.bg-danger { background: #fee2e2 !important; color: #b91c1c !important; }
    </style>
</h:head>

<h:body>
    <f:metadata>
        <f:viewAction action="#{loginBean.verificarSesionInstructor}"/>
    </f:metadata>

    <div class="layout-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>L-MACK</h3>
            </div>
            <nav class="sidebar-nav">
                <h:link outcome="/pages/instructor/index.xhtml" value="🏠 Inicio" styleClass="sidebar-link"/>
                <h:link outcome="/pages/instructor/misFichas.xhtml" value="📁 Mis Fichas" styleClass="sidebar-link"/>
                <h:link outcome="/pages/instructor/asistencias/listarAsistencias.xhtml" value="📋 Asistencia" styleClass="sidebar-link"/>
                <h:link outcome="/pages/instructor/consultarMinutas.xhtml" value="📝 Minutas" styleClass="sidebar-link"/>
                <h:link outcome="/pages/instructor/listarIncidentes.xhtml" value="⚠️ Incidentes" styleClass="sidebar-link"/>
                <h:link outcome="/pages/instructor/traslados/listarTraslados.xhtml" value="🚚 Traslados" styleClass="sidebar-link"/>
                <h:link outcome="/pages/instructor/consultarAmbientes.xhtml" value="🏢 Ambientes" styleClass="sidebar-link"/>
                <h:link outcome="/pages/perfil.xhtml" value="👤 Mi Perfil" styleClass="sidebar-link"/>
            </nav>
            <div class="sidebar-footer">
                <h:form>
                    <p:commandButton value="Cerrar sesión"
                                     icon="pi pi-sign-out"
                                     action="#{loginBean.cerrarSesion}"
                                     styleClass="btn-logout"
                                     ajax="false"/>
                </h:form>
            </div>
        </aside>
        
        <main class="main-content">
            <div class="content-wrapper">
                <div class="form-header">
                    <h2><i class="pi pi-check-circle" style="margin-right: 10px;"></i>Control de Asistencia</h2>
                </div>
                
                <p:messages showSummary="true" closable="true" severity="info,error,warn"/>

                <h:form id="frmAsistencia" styleClass="ui-fluid">
                    <div style="text-align:center;margin-bottom:16px;">
                        <p:commandButton value="➕ Nuevo registro"
                                         styleClass="btn btn-primary"
                                         actionListener="#{asistenciaBean.prepararNuevo}"
                                         update="dialogAsistencia"
                                         oncomplete="PF('dlgAsistencia').show()"
                                         ajax="false"/>
                    </div>

                    <p:toolbar style="margin-bottom: 10px;">
                        <f:facet name="left">
                            <p:commandButton value="📄 Exportar PDF"
                                             icon="pi pi-file-pdf"
                                             styleClass="btn-primary"
                                             ajax="false"
                                             onclick="PF('tablaAsistencia').exportToPdf();"/>
                            <p:commandButton value="📊 Exportar Excel"
                                             icon="pi pi-file-excel"
                                             styleClass="btn-success"
                                             ajax="false"
                                             onclick="PF('tablaAsistencia').exportToXls();"/>
                        </f:facet>
                    </p:toolbar>

                    <p:dataTable id="tablaAsistencia" 
                                 value="#{asistenciaBean.asistencias}" 
                                 var="asis"
                                 filteredValue="#{asistenciaBean.asistenciasFiltradas}"
                                 emptyMessage="No hay asistencias registradas"
                                 paginator="true" 
                                 rows="10"
                                 paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
                                 rowsPerPageTemplate="5,10,15,20"
                                 styleClass="table table-striped table-hover"
                                 style="margin-top:1rem;"
                                 exportable="true">
                        <p:column headerText="ID" 
                                 filterBy="#{asis.idAsistencia}" 
                                 filterMatchMode="exact"
                                 style="width: 80px;">
                            <h:outputText value="#{asis.idAsistencia}" />
                        </p:column>
                        <p:column headerText="Aprendiz" 
                                 filterBy="#{asis.aprendizNombre != null ? asis.aprendizNombre : 'Aprendiz ' + asis.aprendizUsuarioId}" 
                                 filterMatchMode="contains"
                                 style="width:200px;">
                            <h:outputText value="#{asis.aprendizNombre != null ? asis.aprendizNombre : 'Aprendiz ' + asis.aprendizUsuarioId}" />
                        </p:column>
                        <p:column headerText="Fecha" 
                                 filterBy="#{asistenciaBean.formatearFecha(asis.fecha)}" 
                                 filterMatchMode="contains"
                                 style="width:120px;text-align:center;">
                            <h:outputText value="#{asistenciaBean.formatearFecha(asis.fecha)}" rendered="#{asis.fecha != null}" />
                        </p:column>
                        <p:column headerText="Estado" 
                                 filterBy="#{asistenciaBean.getEstadoTexto(asis.estado)}" 
                                 filterMatchMode="contains"
                                 style="width:120px;text-align:center;">
                            <span class="badge #{asis.estado == 'S' ? 'bg-success' : asis.estado == 'R' ? 'bg-warning' : 'bg-danger'}">
                                #{asistenciaBean.getEstadoTexto(asis.estado)}
                            </span>
                        </p:column>
                        <p:column headerText="Instructor" 
                                 filterBy="#{asis.instructorNombre != null ? asis.instructorNombre : 'Instructor ' + asis.instructorUsuarioId}" 
                                 filterMatchMode="contains"
                                 style="width:200px;">
                            <h:outputText value="#{asis.instructorNombre != null ? asis.instructorNombre : 'Instructor ' + asis.instructorUsuarioId}" />
                        </p:column>
                        <p:column headerText="Jornada" 
                                 filterBy="#{asis.jornadaNombre != null ? asis.jornadaNombre : asis.jornadaId}" 
                                 filterMatchMode="contains"
                                 style="width:120px;text-align:center;">
                            <h:outputText value="#{asis.jornadaNombre != null ? asis.jornadaNombre : asis.jornadaId}"/>
                        </p:column>
                        <p:column headerText="Acciones" 
                                 style="width:200px;text-align:center;"
                                 exportable="false">
                            <div style="display: flex; gap: 5px; justify-content: center;">
                                <p:commandButton value="Editar"
                                                 styleClass="btn btn-sm btn-warning"
                                                 actionListener="#{asistenciaBean.editar()}"
                                                 update="dialogAsistencia"
                                                 oncomplete="PF('dlgAsistencia').show()"
                                                 ajax="false">
                                    <f:setPropertyActionListener target="#{asistenciaBean.idAsistenciaSeleccionada}" value="#{asis.idAsistencia}"/>
                                </p:commandButton>
                                <p:commandButton value="Eliminar"
                                                 styleClass="btn btn-sm btn-danger"
                                                 actionListener="#{asistenciaBean.eliminar()}"
                                                 update="tablaAsistencia"
                                                 onclick="return confirm('¿Eliminar registro?');"
                                                 ajax="false">
                                    <f:setPropertyActionListener target="#{asistenciaBean.idAsistenciaSeleccionada}" value="#{asis.idAsistencia}"/>
                                </p:commandButton>
                            </div>
                        </p:column>
                    </p:dataTable>

                    <p:dialog widgetVar="dlgAsistencia" header="Registro de Inasistencia" modal="true" width="650"
                              resizable="false" id="dialogAsistencia">
                        <h:form styleClass="ui-fluid">
                            <p:panelGrid columns="2" columnClasses="col, col">
                                <p:outputLabel value="Aprendiz" required="true"/>
                                <p:selectOneMenu value="#{asistenciaBean.asistencia.aprendizUsuarioId}" required="true" filter="true">
                                    <f:selectItem itemLabel="Seleccione..." itemValue="#{null}"/>
                                    <f:selectItems value="#{asistenciaBean.aprendicesUsuarios}" var="usuario"
                                                   itemLabel="#{usuario.nombre}"
                                                   itemValue="#{usuario.idUsuario}"/>
                                </p:selectOneMenu>

                                <p:outputLabel value="Instructor" required="true"/>
                                <p:selectOneMenu value="#{asistenciaBean.asistencia.instructorUsuarioId}" required="true" filter="true">
                                    <f:selectItem itemLabel="Seleccione..." itemValue="#{null}"/>
                                    <f:selectItems value="#{asistenciaBean.instructoresUsuarios}" var="usuario"
                                                   itemLabel="#{usuario.nombre}"
                                                   itemValue="#{usuario.idUsuario}"/>
                                </p:selectOneMenu>

                                <p:outputLabel value="Jornada" required="true"/>
                                <p:selectOneMenu value="#{asistenciaBean.asistencia.jornadaId}" required="true" filter="true">
                                    <f:selectItem itemLabel="Seleccione..." itemValue="#{null}"/>
                                    <f:selectItems value="#{asistenciaBean.jornadas}" var="jornada"
                                                   itemLabel="#{jornada.nombreJornada}"
                                                   itemValue="#{jornada.idJornada}"/>
                                </p:selectOneMenu>

                                <p:outputLabel value="Estado" required="true"/>
                                <p:selectOneMenu value="#{asistenciaBean.asistencia.estado}" required="true">
                                    <f:selectItem itemLabel="Seleccione..." itemValue=""/>
                                    <f:selectItem itemLabel="Asistió (S)" itemValue="S"/>
                                    <f:selectItem itemLabel="Retraso (R)" itemValue="R"/>
                                    <f:selectItem itemLabel="No asistió (N)" itemValue="N"/>
                                </p:selectOneMenu>

                                <p:outputLabel value="Fecha" required="true"/>
                                <p:calendar value="#{asistenciaBean.fechaDate}"
                                              showIcon="true" pattern="dd/MM/yyyy"
                                              required="true"/>
                            </p:panelGrid>

                            <p:commandButton value="Guardar" actionListener="#{asistenciaBean.guardar}"
                                             update=":frmAsistencia"
                                             oncomplete="PF('dlgAsistencia').hide()"
                                             style="display:inline-block;padding:12px 20px;background:#10b981;color:white;border-radius:10px;text-decoration:none;font-weight:600;border:none;cursor:pointer;"
                                             ajax="false"/>
                            <p:commandButton value="Cancelar" onclick="PF('dlgAsistencia').hide()"
                                             styleClass="btn-secondary"/>
                        </h:form>
                    </p:dialog>
                </h:form>
            </div>
        </main>
    </div>

</h:body>
</html>
