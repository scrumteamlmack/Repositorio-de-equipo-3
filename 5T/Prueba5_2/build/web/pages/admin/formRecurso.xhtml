<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Registrar Recurso - L-MACK</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
    <meta http-equiv="Pragma" content="no-cache"/>
    <meta http-equiv="Expires" content="0"/>
    <link rel="stylesheet" type="text/css" href="#{facesContext.externalContext.requestContextPath}/resources/css/emac-style.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        .layout-container {
            display: flex;
            min-height: 100vh;
            background-color: var(--cream-bg);
        }
        
        .sidebar {
            width: 260px;
            background-color: var(--primary-green);
            color: white;
            padding: 0;
            box-shadow: 2px 0 8px rgba(0,0,0,0.1);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            padding: 25px 20px;
            background-color: var(--dark-green);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .sidebar-header h3 {
            color: white;
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .sidebar-header h3::before {
            content: "👤";
            font-size: 28px;
        }
        
        .sidebar-nav {
            padding: 20px 0;
            flex: 1;
        }
        
        .sidebar-nav a {
            display: block;
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            padding: 15px 25px;
            transition: all 0.3s;
            border-left: 3px solid transparent;
            font-size: 15px;
        }
        
        .sidebar-nav a:hover {
            background: rgba(255,255,255,0.1);
            border-left-color: var(--light-green);
            color: white;
            padding-left: 30px;
        }
        
        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: auto;
        }
        
        .sidebar-footer .btn-logout {
            width: 100%;
            padding: 12px 20px;
            background-color: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .sidebar-footer .btn-logout:hover {
            background-color: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.3);
        }
        
        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 20px;
            min-height: 100vh;
            background-color: var(--cream-bg);
        }
        
        .content-wrapper {
            background: var(--white);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .form-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-section {
            background: var(--white);
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        .form-label {
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-dark);
            display: block;
        }
        .btn-group-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--border-gray);
        }
        .d-flex {
            display: flex;
        }
        .justify-content-between {
            justify-content: space-between;
        }
        .align-items-center {
            align-items: center;
        }
        .mb-4 {
            margin-bottom: 1.5rem;
        }
        .mb-0 {
            margin-bottom: 0;
        }
        .mb-3 {
            margin-bottom: 1rem;
        }
        .row {
            display: flex;
            flex-wrap: wrap;
            margin: 0 -10px;
        }
        .col-md-6 {
            flex: 0 0 50%;
            max-width: 50%;
            padding: 0 10px;
            margin-bottom: 15px;
        }
        @media (max-width: 768px) {
            .col-md-6 {
                flex: 0 0 100%;
                max-width: 100%;
            }
        }
        .text-muted {
            color: var(--text-gray);
            font-size: 12px;
            display: block;
            margin-top: 5px;
        }
    </style>
</h:head>

<h:body>
    <f:metadata>
        <f:viewAction action="#{loginBean.verificarSesion(1)}"/>
    </f:metadata>

    <div class="layout-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>L-MACK</h3>
            </div>
            <nav class="sidebar-nav">
                <h:link outcome="/pages/admin/indexAdmin.xhtml" value="🏠 Inicio" styleClass="sidebar-link"/>
                <h:link outcome="/pages/admin/listarUsuarios.xhtml" value="👥 Usuarios" styleClass="sidebar-link"/>
                <h:link outcome="/pages/admin/formUsuario.xhtml" value="➕ Crear Usuario" styleClass="sidebar-link"/>
                <h:link outcome="/pages/admin/listarFichas.xhtml" value="📁 Fichas" styleClass="sidebar-link"/>
                <h:link outcome="/pages/admin/listarProgramas.xhtml" value="📚 Programas" styleClass="sidebar-link"/>
                <h:link outcome="/pages/admin/listarRecursos.xhtml" value="💻 Recursos" styleClass="sidebar-link"/>
                <h:link outcome="/pages/admin/listarAmbientes.xhtml" value="🏢 Ambientes" styleClass="sidebar-link"/>
                <h:link outcome="/pages/perfil.xhtml" value="👤 Mi Perfil" styleClass="sidebar-link"/>
            </nav>
            <div class="sidebar-footer">
                <h:form>
                    <p:commandButton value="Cerrar sesión"
                                     icon="pi pi-sign-out"
                                     action="#{loginBean.cerrarSesion}"
                                     styleClass="btn-logout"
                                     ajax="false"/>
                </h:form>
            </div>
        </aside>
        
        <main class="main-content">
            <div class="content-wrapper">
                <h:form id="formRecurso">
                    <div class="form-container">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h3 class="mb-0">
                                <i class="pi pi-desktop" style="margin-right: 10px;"></i>
                                Registrar Recurso
                            </h3>
                        </div>

                        <p:messages showSummary="true" closable="true" severity="info,error,warn" styleClass="mb-3"/>

                        <div class="form-section">
                            <h5 class="mb-4">Datos del Recurso</h5>
                            
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Nombre del Recurso</label>
                                    <p:inputText id="nombre" 
                                                 value="#{recursoBean.recurso.nombre}" 
                                                 required="true"
                                                 requiredMessage="El nombre del recurso es obligatorio"
                                                 placeholder="Ingrese el nombre del recurso"
                                                 styleClass="form-control"/>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Serial</label>
                                    <p:inputText id="serial" 
                                                 value="#{recursoBean.recurso.serial}" 
                                                 required="true"
                                                 requiredMessage="El serial es obligatorio"
                                                 placeholder="Ingrese el serial del recurso"
                                                 styleClass="form-control"/>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Número</label>
                                    <p:inputNumber id="numero" 
                                                   value="#{recursoBean.recurso.numero}" 
                                                   required="true"
                                                   requiredMessage="El número es obligatorio"
                                                   placeholder="Ingrese el número"
                                                   decimalPlaces="0"
                                                   integerOnly="true"
                                                   styleClass="form-control"/>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Tipo de Recurso</label>
                                    <p:selectOneMenu id="tipoRecurso" 
                                                     value="#{recursoBean.recurso.idTipoRecurso}" 
                                                     required="true"
                                                     requiredMessage="Debe seleccionar un tipo de recurso"
                                                     filter="true"
                                                     styleClass="form-select"
                                                     style="width: 100%;">
                                        <f:selectItem itemLabel="Seleccione un tipo..." itemValue="0" />
                                        <f:selectItems value="#{recursoBean.tipos}" 
                                                       var="tipo"
                                                       itemLabel="#{tipo.nombre}" 
                                                       itemValue="#{tipo.idTipoRecurso}" />
                                    </p:selectOneMenu>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Ambiente</label>
                                    <p:selectOneMenu id="ambiente" 
                                                     value="#{recursoBean.recurso.idAmbiente}" 
                                                     required="true"
                                                     requiredMessage="Debe seleccionar un ambiente"
                                                     filter="true"
                                                     styleClass="form-select"
                                                     style="width: 100%;">
                                        <f:selectItem itemLabel="Seleccione un ambiente..." itemValue="0" />
                                        <f:selectItems value="#{recursoBean.ambientes}" 
                                                       var="amb"
                                                       itemLabel="#{amb.numero} - #{amb.tipo}"
                                                       itemValue="#{amb.idAmbiente}" />
                                    </p:selectOneMenu>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Estado</label>
                                    <p:selectOneMenu id="estado" 
                                                     value="#{recursoBean.recurso.estado}" 
                                                     required="true"
                                                     requiredMessage="Debe seleccionar un estado"
                                                     styleClass="form-select"
                                                     style="width: 100%;">
                                        <f:selectItem itemLabel="Seleccione un estado..." itemValue=""/>
                                        <f:selectItem itemLabel="Disponible" itemValue="Disponible"/>
                                        <f:selectItem itemLabel="En mantenimiento" itemValue="En mantenimiento"/>
                                        <f:selectItem itemLabel="Dañado" itemValue="Dañado"/>
                                    </p:selectOneMenu>
                                </div>

                                <div class="col-md-12">
                                    <label class="form-label">Observación</label>
                                    <p:inputTextarea id="observacion" 
                                                     value="#{recursoBean.recurso.observacion}" 
                                                     placeholder="Ingrese una observación (opcional)"
                                                     rows="4"
                                                     autoResize="false"
                                                     styleClass="form-control"
                                                     style="width: 100%;"/>
                                </div>
                            </div>

                            <div class="btn-group-actions">
                                <p:commandButton value="Cancelar"
                                                 action="/pages/admin/listarRecursos.xhtml?faces-redirect=true"
                                                 icon="pi pi-times"
                                                 ajax="false"
                                                 styleClass="btn btn-secondary"
                                                 style="min-width: 120px;"/>
                                <p:commandButton value="Guardar"
                                                 action="#{recursoBean.guardar}"
                                                 icon="pi pi-save"
                                                 ajax="false"
                                                 styleClass="btn btn-primary"
                                                 style="min-width: 120px;"/>
                            </div>
                        </div>
                    </div>
                </h:form>
            </div>
        </main>
    </div>
</h:body>
</html>
