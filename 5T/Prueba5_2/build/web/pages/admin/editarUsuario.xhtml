<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Editar Usuario - L-MACK</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
    <meta http-equiv="Pragma" content="no-cache"/>
    <meta http-equiv="Expires" content="0"/>
    <link rel="stylesheet" type="text/css" href="#{facesContext.externalContext.requestContextPath}/resources/css/emac-style.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        .layout-container {
            display: flex;
            min-height: 100vh;
            background-color: var(--cream-bg);
        }
        
        .sidebar {
            width: 260px;
            background-color: var(--primary-green);
            color: white;
            padding: 0;
            box-shadow: 2px 0 8px rgba(0,0,0,0.1);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            padding: 25px 20px;
            background-color: var(--dark-green);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .sidebar-header h3 {
            color: white;
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .sidebar-header h3::before {
            content: "👤";
            font-size: 28px;
        }
        
        .sidebar-nav {
            padding: 20px 0;
            flex: 1;
        }
        
        .sidebar-nav a {
            display: block;
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            padding: 15px 25px;
            transition: all 0.3s;
            border-left: 3px solid transparent;
            font-size: 15px;
        }
        
        .sidebar-nav a:hover {
            background: rgba(255,255,255,0.1);
            border-left-color: var(--light-green);
            color: white;
            padding-left: 30px;
        }
        
        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: auto;
        }
        
        .sidebar-footer .btn-logout {
            width: 100%;
            padding: 12px 20px;
            background-color: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .sidebar-footer .btn-logout:hover {
            background-color: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.3);
        }
        
        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 20px;
            min-height: 100vh;
            background-color: var(--cream-bg);
        }
        
        .content-wrapper {
            background: var(--white);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .form-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-section {
            background: var(--white);
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        .form-label {
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-dark);
            display: block;
        }
        .btn-group-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--border-gray);
        }
        .d-flex {
            display: flex;
        }
        .justify-content-between {
            justify-content: space-between;
        }
        .align-items-center {
            align-items: center;
        }
        .mb-4 {
            margin-bottom: 1.5rem;
        }
        .mb-0 {
            margin-bottom: 0;
        }
        .mb-3 {
            margin-bottom: 1rem;
        }
        .row {
            display: flex;
            flex-wrap: wrap;
            margin: 0 -10px;
        }
        .col-md-6 {
            flex: 0 0 50%;
            max-width: 50%;
            padding: 0 10px;
            margin-bottom: 15px;
        }
        @media (max-width: 768px) {
            .col-md-6 {
                flex: 0 0 100%;
                max-width: 100%;
            }
        }
        .text-muted {
            color: var(--text-gray);
            font-size: 12px;
            display: block;
            margin-top: 5px;
        }
        .readonly-field {
            background-color: #f5f5f5;
            color: #6c757d;
        }
    </style>
</h:head>

<h:body>
    <f:metadata>
        <f:viewAction action="#{loginBean.verificarSesionAdmin}"/>
    </f:metadata>

    <div class="layout-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>L-MACK</h3>
            </div>
            <nav class="sidebar-nav">
                <h:link outcome="/pages/admin/indexAdmin.xhtml" value="🏠 Inicio" styleClass="sidebar-link"/>
                <h:link outcome="/pages/admin/listarUsuarios.xhtml" value="👥 Usuarios" styleClass="sidebar-link"/>
                <h:link outcome="/pages/admin/formUsuario.xhtml" value="➕ Crear Usuario" styleClass="sidebar-link"/>
                <h:link outcome="/pages/admin/listarFichas.xhtml" value="📁 Fichas" styleClass="sidebar-link"/>
                <h:link outcome="/pages/admin/listarProgramas.xhtml" value="📚 Programas" styleClass="sidebar-link"/>
                <h:link outcome="/pages/admin/listarRecursos.xhtml" value="💻 Recursos" styleClass="sidebar-link"/>
                <h:link outcome="/pages/admin/listarAmbientes.xhtml" value="🏢 Ambientes" styleClass="sidebar-link"/>
                <h:link outcome="/pages/perfil.xhtml" value="👤 Mi Perfil" styleClass="sidebar-link"/>
            </nav>
            <div class="sidebar-footer">
                <h:form>
                    <p:commandButton value="Cerrar sesión"
                                     icon="pi pi-sign-out"
                                     action="#{loginBean.cerrarSesion}"
                                     styleClass="btn-logout"
                                     ajax="false"/>
                </h:form>
            </div>
        </aside>
        
        <main class="main-content">
            <div class="content-wrapper">
                <h:form id="formEditarUsuario">
                    <f:metadata>
                        <f:viewParam name="id" value="#{usuarioBean.idUsuarioEditar}">
                            <f:converter converterId="javax.faces.Integer" />
                        </f:viewParam>
                        <f:viewAction action="#{usuarioBean.cargarUsuarioParaEditar}" />
                    </f:metadata>
                    
                    <div class="form-container">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h3 class="mb-0">
                                <i class="pi pi-user-edit" style="margin-right: 10px;"></i>
                                Editar Usuario
                            </h3>
                        </div>

                        <p:messages showSummary="true" closable="true" severity="info,error,warn" styleClass="mb-3"/>

                        <div class="form-section">
                            <h5 class="mb-4">Datos del Usuario</h5>
                            
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Primer Nombre</label>
                                    <p:inputText id="pNombre" 
                                                 value="#{usuarioBean.usuario.PNombre}" 
                                                 required="true"
                                                 requiredMessage="El primer nombre es obligatorio"
                                                 placeholder="Ingrese el primer nombre"
                                                 styleClass="form-control"/>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Segundo Nombre</label>
                                    <p:inputText id="sNombre" 
                                                 value="#{usuarioBean.usuario.SNombre}"
                                                 placeholder="Ingrese el segundo nombre (opcional)"
                                                 styleClass="form-control"/>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Primer Apellido</label>
                                    <p:inputText id="pApellido" 
                                                 value="#{usuarioBean.usuario.PApellido}" 
                                                 required="true"
                                                 requiredMessage="El primer apellido es obligatorio"
                                                 placeholder="Ingrese el primer apellido"
                                                 styleClass="form-control"/>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Segundo Apellido</label>
                                    <p:inputText id="sApellido" 
                                                 value="#{usuarioBean.usuario.SApellido}"
                                                 placeholder="Ingrese el segundo apellido (opcional)"
                                                 styleClass="form-control"/>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Tipo de Documento</label>
                                    <p:selectOneMenu id="tipoDoc" 
                                                     value="#{usuarioBean.usuario.tipoDocumento}" 
                                                     required="true"
                                                     requiredMessage="El tipo de documento es obligatorio"
                                                     styleClass="form-select"
                                                     style="width: 100%;">
                                        <f:selectItem itemLabel="Seleccione..." itemValue=""/>
                                        <f:selectItem itemLabel="CC" itemValue="CC"/>
                                        <f:selectItem itemLabel="TI" itemValue="TI"/>
                                        <f:selectItem itemLabel="CE" itemValue="CE"/>
                                        <f:selectItem itemLabel="OTRO" itemValue="OTRO"/>
                                    </p:selectOneMenu>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Número Documento</label>
                                    <p:inputText id="numDoc" 
                                                 value="#{usuarioBean.usuario.numDocumento}" 
                                                 disabled="true"
                                                 styleClass="form-control readonly-field"/>
                                    <small class="text-muted">El número de documento no se puede modificar</small>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Correo</label>
                                    <p:inputText id="correo" 
                                                 value="#{usuarioBean.usuario.correo}" 
                                                 required="true"
                                                 requiredMessage="El correo es obligatorio"
                                                 placeholder="correo@ejemplo.com"
                                                 styleClass="form-control"/>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Contraseña</label>
                                    <p:password id="pass" 
                                                value="#{usuarioBean.usuario.pass}" 
                                                placeholder="Dejar vacío para mantener la actual"
                                                feedback="false"
                                                styleClass="form-control"/>
                                    <small class="text-muted">Dejar vacío para mantener la contraseña actual</small>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Rol Actual</label>
                                    <p:inputText value="#{usuarioBean.obtenerNombreRol(usuarioBean.idUsuarioEditar)}" 
                                                 disabled="true"
                                                 styleClass="form-control readonly-field"/>
                                    <small class="text-muted">El rol no se puede modificar desde aquí</small>
                                </div>
                            </div>

                            <div class="btn-group-actions">
                                <p:commandButton value="Cancelar"
                                                 action="/pages/admin/listarUsuarios.xhtml?faces-redirect=true"
                                                 icon="pi pi-times"
                                                 ajax="false"
                                                 styleClass="btn btn-secondary"
                                                 style="min-width: 120px;"/>
                                <p:commandButton value="Guardar Cambios"
                                                 action="#{usuarioBean.actualizarUsuario}"
                                                 icon="pi pi-save"
                                                 ajax="false"
                                                 styleClass="btn btn-primary"
                                                 style="min-width: 120px;"/>
                            </div>
                        </div>
                    </div>
                </h:form>
            </div>
        </main>
    </div>
</h:body>
</html>
