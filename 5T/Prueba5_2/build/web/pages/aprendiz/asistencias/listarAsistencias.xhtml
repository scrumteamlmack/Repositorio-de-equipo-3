<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Mis Asistencias - L-MACK</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
    <meta http-equiv="Pragma" content="no-cache"/>
    <meta http-equiv="Expires" content="0"/>
    <link rel="stylesheet" type="text/css" href="#{facesContext.externalContext.requestContextPath}/resources/css/emac-style.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        .layout-container {
            display: flex;
            min-height: 100vh;
            background-color: var(--cream-bg);
        }
        
        .sidebar {
            width: 260px;
            background-color: var(--primary-green);
            color: white;
            padding: 0;
            box-shadow: 2px 0 8px rgba(0,0,0,0.1);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            padding: 25px 20px;
            background-color: var(--dark-green);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .sidebar-header h3 {
            color: white;
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .sidebar-header h3::before {
            content: "👤";
            font-size: 28px;
        }
        
        .sidebar-nav {
            padding: 20px 0;
            flex: 1;
        }
        
        .sidebar-nav a {
            display: block;
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            padding: 15px 25px;
            transition: all 0.3s;
            border-left: 3px solid transparent;
            font-size: 15px;
        }
        
        .sidebar-nav a:hover {
            background: rgba(255,255,255,0.1);
            border-left-color: var(--light-green);
            color: white;
            padding-left: 30px;
        }
        
        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: auto;
        }
        
        .sidebar-footer .btn-logout {
            width: 100%;
            padding: 12px 20px;
            background-color: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .sidebar-footer .btn-logout:hover {
            background-color: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.3);
        }
        
        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 20px;
            min-height: 100vh;
            background-color: var(--cream-bg);
        }
        
        .content-wrapper {
            background: var(--white);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
        }
        .badge.bg-success { background: #dcfce7 !important; color: #15803d !important; }
        .badge.bg-warning { background: #fef3c7 !important; color: #92400e !important; }
        .badge.bg-danger { background: #fee2e2 !important; color: #b91c1c !important; }
    </style>
</h:head>

<h:body>
    <f:metadata>
        <f:viewAction action="#{loginBean.verificarSesionAprendiz}"/>
    </f:metadata>

    <div class="layout-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>L-MACK</h3>
            </div>
            <nav class="sidebar-nav">
                <h:link outcome="/pages/aprendiz/index.xhtml" value="🏠 Inicio" styleClass="sidebar-link"/>
                <h:link outcome="/pages/aprendiz/asistencias/listarAsistencias.xhtml" value="📋 Mis Asistencias" styleClass="sidebar-link"/>
                <h:link outcome="/pages/perfil.xhtml" value="👤 Mi Perfil" styleClass="sidebar-link"/>
            </nav>
            <div class="sidebar-footer">
                <h:form>
                    <p:commandButton value="Cerrar sesión"
                                     icon="pi pi-sign-out"
                                     action="#{loginBean.cerrarSesion}"
                                     styleClass="btn-logout"
                                     ajax="false"/>
                </h:form>
            </div>
        </aside>
        
        <main class="main-content">
            <div class="content-wrapper">
                <div class="form-header">
                    <h2><i class="pi pi-check-circle" style="margin-right: 10px;"></i>Mis Asistencias</h2>
                </div>
                
                <p:messages showSummary="true" closable="true" severity="info,error,warn"/>

                <h:form id="formAsistencias">
                    <p:toolbar>
                        <f:facet name="left">
                            <p:commandButton value="📄 Exportar PDF"
                                             icon="pi pi-file-pdf"
                                             styleClass="btn-primary"
                                             ajax="false"
                                             onclick="PF('tablaAsistencias').exportToPdf();"/>
                            <p:commandButton value="📊 Exportar Excel"
                                             icon="pi pi-file-excel"
                                             styleClass="btn-success"
                                             ajax="false"
                                             onclick="PF('tablaAsistencias').exportToXls();"/>
                        </f:facet>
                    </p:toolbar>

                    <p:dataTable id="tablaAsistencias" 
                                 value="#{asistenciaAprendizBean.asistencias}" 
                                 var="asis"
                                 filteredValue="#{asistenciaAprendizBean.asistenciasFiltradas}"
                                 emptyMessage="No hay asistencias registradas"
                                 paginator="true" 
                                 rows="10"
                                 paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
                                 rowsPerPageTemplate="5,10,15,20"
                                 styleClass="table table-striped table-hover"
                                 style="margin-top:1rem;"
                                 exportable="true">

                        <p:column headerText="ID" 
                                 filterBy="#{asis.idAsistencia}" 
                                 filterMatchMode="exact"
                                 style="width: 80px;">
                            <h:outputText value="#{asis.idAsistencia}" />
                        </p:column>

                        <p:column headerText="Fecha" 
                                 filterBy="#{asistenciaAprendizBean.formatearFecha(asis.fecha)}" 
                                 filterMatchMode="contains"
                                 style="width: 120px;text-align:center;">
                            <h:outputText value="#{asistenciaAprendizBean.formatearFecha(asis.fecha)}" rendered="#{asis.fecha != null}" />
                        </p:column>

                        <p:column headerText="Estado" 
                                 filterBy="#{asistenciaAprendizBean.getEstadoTexto(asis.estado)}" 
                                 filterMatchMode="contains"
                                 style="width: 120px;text-align:center;">
                            <span class="badge #{asis.estado == 'S' ? 'bg-success' : asis.estado == 'R' ? 'bg-warning' : 'bg-danger'}">
                                #{asistenciaAprendizBean.getEstadoTexto(asis.estado)}
                            </span>
                        </p:column>

                        <p:column headerText="Instructor" 
                                 filterBy="#{asis.instructorNombre != null ? asis.instructorNombre : 'Instructor ' + asis.instructorUsuarioId}" 
                                 filterMatchMode="contains"
                                 style="width:200px;">
                            <h:outputText value="#{asis.instructorNombre != null ? asis.instructorNombre : 'Instructor ' + asis.instructorUsuarioId}" />
                        </p:column>

                        <p:column headerText="Jornada" 
                                 filterBy="#{asis.jornadaNombre != null ? asis.jornadaNombre : asis.jornadaId}" 
                                 filterMatchMode="contains"
                                 style="width: 150px;text-align:center;">
                            <h:outputText value="#{asis.jornadaNombre != null ? asis.jornadaNombre : 'Jornada ' + asis.jornadaId}" />
                        </p:column>

                    </p:dataTable>
                </h:form>
            </div>
        </main>
    </div>

</h:body>
</html>
