<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>#{minutaBean.modoEdicion ? 'Editar Minuta' : 'Registrar Minuta'} - L-MACK</title>
    <link rel="stylesheet" type="text/css" href="#{facesContext.externalContext.requestContextPath}/resources/css/emac-style.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</h:head>

<h:body>

    <h:form id="formMinuta">

        <!-- NAVBAR -->
        <div class="navbar">
            <div class="title">L-MACK</div>
            <div class="menu">
                <p:commandButton value="Inicio"
                                 icon="pi pi-home"
                                 action="/pages/guarda/index.xhtml?faces-redirect=true"
                                 styleClass="btn btn-secondary"
                                 ajax="false"/>
                <p:menuButton value="Módulos" icon="pi pi-th-large" styleClass="btn btn-secondary">
                    <p:menuitem value="Minutas"
                                icon="pi pi-file"
                                outcome="/pages/guarda/minutas/listarMinutas.xhtml"/>
                    <p:menuitem value="Traslados"
                                icon="pi pi-truck"
                                outcome="/pages/guarda/traslados/listarTraslados.xhtml"/>
                    <p:menuitem value="Incidentes"
                                icon="pi pi-exclamation-triangle"
                                outcome="/pages/incidentes/list.xhtml"/>
                    <p:menuitem value="Ambientes"
                                icon="pi pi-building"
                                outcome="/pages/ambientes/list.xhtml"/>
                </p:menuButton>
                <p:commandButton value="Cerrar sesión"
                                 icon="pi pi-sign-out"
                                 action="#{loginBean.cerrarSesion}"
                                 styleClass="btn btn-secondary"
                                 ajax="false"/>
            </div>
        </div>

        <!-- CONTENIDO -->
        <div class="content">
            <f:metadata>
                <f:viewParam name="idMinutaEditar" value="#{minutaBean.idMinutaEditar}">
                    <f:converter converterId="javax.faces.Integer" />
                </f:viewParam>
            </f:metadata>

            <div class="form-header">
                <h2>
                    <i class="pi pi-file" style="margin-right: 10px;"></i>
                    #{minutaBean.modoEdicion ? 'Editar Minuta' : 'Registrar Minuta'}
                </h2>
            </div>

            <p:messages showSummary="true" closable="true" severity="info,error,warn"/>

            <p:panel header="Datos de la Minuta">
                <h:panelGrid columns="2" cellpadding="15" columnClasses="label-col, input-col">

                    <h:outputLabel value="Ambiente:" for="ambiente" />
                    <p:selectOneMenu id="ambiente" 
                                     value="#{minutaBean.minuta.ambienteId}" 
                                     required="true" 
                                     requiredMessage="Debe seleccionar un ambiente"
                                     filter="true"
                                     style="width: 100%;">
                        <f:selectItem itemLabel="Seleccione un ambiente" itemValue="0" />
                        <f:selectItems value="#{minutaBean.ambientes}" 
                                      var="amb"
                                      itemLabel="Ambiente #{amb.numero} - #{amb.tipo}" 
                                      itemValue="#{amb.idAmbiente}" />
                    </p:selectOneMenu>

                    <h:outputLabel value="Estado:" for="estado" />
                    <p:selectOneMenu id="estado" 
                                     value="#{minutaBean.minuta.estado}" 
                                     required="true" 
                                     requiredMessage="Debe seleccionar un estado"
                                     style="width: 100%;">
                        <f:selectItem itemLabel="Normal" itemValue="Normal"/>
                        <f:selectItem itemLabel="Novedad" itemValue="Novedad"/>
                        <f:selectItem itemLabel="Disponible" itemValue="Disponible"/>
                        <f:selectItem itemLabel="Ocupado" itemValue="Ocupado"/>
                    </p:selectOneMenu>

                    <h:outputLabel value="Guarda de Seguridad:" for="guarda" />
                    <p:selectOneMenu id="guarda" 
                                     value="#{minutaBean.minuta.guardaId}" 
                                     required="true" 
                                     requiredMessage="Debe seleccionar un guarda de seguridad"
                                     filter="true"
                                     style="width: 100%;">
                        <f:selectItem itemLabel="Seleccione un guarda" itemValue="0" />
                        <f:selectItems value="#{minutaBean.guardas}" 
                                      var="g"
                                      itemLabel="Guarda ID: #{g.idUsuario}" 
                                      itemValue="#{g.idUsuario}" />
                    </p:selectOneMenu>

                    <h:outputLabel value="Instructor Responsable:" for="responsable" />
                    <p:selectOneMenu id="responsable" 
                                     value="#{minutaBean.minuta.responsableId}" 
                                     required="true" 
                                     requiredMessage="Debe seleccionar un instructor responsable"
                                     filter="true"
                                     style="width: 100%;">
                        <f:selectItem itemLabel="Seleccione un instructor" itemValue="0" />
                        <f:selectItems value="#{minutaBean.instructores}" 
                                      var="i"
                                      itemLabel="Instructor ID: #{i.idUsuario}" 
                                      itemValue="#{i.idUsuario}" />
                    </p:selectOneMenu>

                    <h:outputLabel value="Fecha y Hora de Recibo:" for="fechaRecibo" />
                    <p:calendar id="fechaRecibo"
                                value="#{minutaBean.fechaReciboDate}"
                                required="true"
                                requiredMessage="Debe seleccionar fecha y hora de recibo"
                                pattern="dd/MM/yyyy HH:mm"
                                showIcon="true"
                                showTime="true"
                                locale="es"
                                style="width: 100%;"/>

                    <h:outputLabel value="Fecha y Hora de Entrega:" for="fechaEntrega" />
                    <p:calendar id="fechaEntrega"
                                value="#{minutaBean.fechaEntregaDate}"
                                required="true"
                                requiredMessage="Debe seleccionar fecha y hora de entrega"
                                pattern="dd/MM/yyyy HH:mm"
                                showIcon="true"
                                showTime="true"
                                locale="es"
                                style="width: 100%;"/>

                    <h:outputLabel value="Novedad:" for="novedad" />
                    <p:inputTextarea id="novedad" 
                                     value="#{minutaBean.minuta.novedad}" 
                                     rows="3"
                                     cols="50"
                                     autoResize="false"
                                     style="width: 100%;"/>

                    <h:outputLabel value="Descripción:" for="descripcion" />
                    <p:inputTextarea id="descripcion" 
                                     value="#{minutaBean.minuta.descripcion}" 
                                     rows="3"
                                     cols="50"
                                     autoResize="false"
                                     style="width: 100%;"/>

                </h:panelGrid>

                <div class="form-actions">
                    <p:commandButton value="Guardar"
                                     action="#{minutaBean.guardar}"
                                     icon="pi pi-save"
                                     ajax="false"
                                     styleClass="btn-primary"/>
                    <p:commandButton value="Cancelar"
                                     action="/pages/guarda/minutas/listarMinutas.xhtml?faces-redirect=true"
                                     icon="pi pi-times"
                                     ajax="false"
                                     styleClass="btn-secondary"/>
                </div>

            </p:panel>
        </div>

    </h:form>

</h:body>
</html>
